<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>World Heart Day 2026 · Creator Studio</title>
  <!-- PWA & Mobile Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WHD Creator">
  <meta name="theme-color" content="#7a0010">
  <style>
    /* ----- RESET & GLOBAL ----- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 30% 20%, #b3001b, #4a000b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
      color: #1a1a1a;
    }

    /* ----- GLASS CARD ----- */
    .creator-container {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 24px 20px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #7a0010;
      text-align: center;
      margin-bottom: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8a5a5a;
      margin-bottom: 16px;
    }

    /* ----- MODE TABS ----- */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.06);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #5a3a3a;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #b3001b;
      box-shadow: 0 6px 14px rgba(180, 20, 40, 0.15);
    }

    /* ----- CANVAS WRAPPER ----- */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #1a0004;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 18px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.3);
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* ----- CONTROLS ----- */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #5e3e3e;
      margin-left: 4px;
      margin-bottom: 2px;
    }

    .file-upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #fff5f6, #ffe6e9);
      border: 2px dashed #c81e1e;
      padding: 14px 12px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.82rem;
      color: #990011;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(200, 30, 30, 0.08);
      text-align: center;
    }

    .file-upload-btn:active {
      transform: scale(0.98);
      background: #ffd9dd;
    }

    .file-upload-btn input[type="file"] {
      display: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      background: #fff;
      font-size: 0.88rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    input[type="text"]:focus {
      border-color: #c81e1e;
      box-shadow: 0 0 0 3px rgba(200, 30, 30, 0.1);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #e0c0c0;
      border-radius: 4px;
      outline: none;
      margin: 4px 0 2px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #c81e1e;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(200, 30, 30, 0.4);
      border: 2px solid #fff;
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      width: 100%;
      padding: 14px 10px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-shuffle {
      background: #23232e;
      color: white;
      grid-column: span 2;
      font-size: 0.85rem;
    }

    .btn-download {
      background: #111;
      color: white;
    }

    .btn-share {
      background: linear-gradient(135deg, #d90429, #7a0010);
      color: white;
    }

    #videoStatus {
      font-size: 0.74rem;
      font-weight: 600;
      color: #990011;
      text-align: center;
      background: rgba(255, 255, 255, 0.8);
      padding: 8px;
      border-radius: 12px;
      display: none;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(200, 30, 30, 0.2);
    }

    /* ----- UTILITY ----- */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="creator-container">
    <h1>SHAH HEALTH PORTAL</h1>
    <div class="subtitle">World Heart Day 2026 Studio</div>

    <!-- MODE SWITCH -->
    <div class="mode-tabs">
      <button class="tab-btn active" id="modeImageBtn" onclick="switchMode('image')" aria-label="Photo poster mode">
        📷 Photo Poster
      </button>
      <button class="tab-btn" id="modeVideoBtn" onclick="switchMode('video')" aria-label="10 second video clip mode">
        🎥 10s Video
      </button>
    </div>

    <!-- CANVAS -->
    <div class="canvas-wrapper">
      <canvas id="creatorCanvas" width="1000" height="1000"></canvas>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <!-- Upload button — label wraps hidden input, so it's fully accessible -->
      <label class="file-upload-btn" id="uploadLabelBtn">
        <span id="uploadBtnText">📸 Shoot / Select Photo</span>
        <input type="file" id="imageUpload" accept="image/*">
      </label>

      <div>
        <div class="field-label">Zoom & Drag inside circle</div>
        <input type="range" id="zoomRange" min="0.5" max="3.0" step="0.05" value="1">
      </div>

      <div>
        <label class="field-label" for="userName">Your name / team (optional)</label>
        <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28">
      </div>

      <button class="btn btn-shuffle" id="shuffleBtn">🔄 Shuffle Slogan & Mascot</button>

      <div id="videoStatus">Recording 10s MP4 Video Clip... Please wait.</div>

      <div class="btn-group">
        <button class="btn btn-download" id="actionDownloadBtn">💾 Save Image</button>
        <button class="btn btn-share" id="actionShareBtn">📤 Share Card</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ---------- DOM refs ----------
      const canvas = document.getElementById('creatorCanvas');
      const ctx = canvas.getContext('2d');
      const uploadLabelBtn = document.getElementById('uploadLabelBtn');
      const uploadBtnText = document.getElementById('uploadBtnText');
      const zoomRange = document.getElementById('zoomRange');
      const userNameInput = document.getElementById('userName');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const actionDownloadBtn = document.getElementById('actionDownloadBtn');
      const actionShareBtn = document.getElementById('actionShareBtn');
      const videoStatus = document.getElementById('videoStatus');
      const imageUpload = document.getElementById('imageUpload');

      // ---------- State ----------
      let userImage = null;
      let userVideo = null;
      let photoScale = 1;
      let photoOffsetX = 0;
      let photoOffsetY = 0;
      let currentMode = 'image';          // 'image' | 'video'
      let animationId = null;
      let recordingStartTime = 0;
      let lastRecordedVideoBlob = null;
      let isDragging = false;
      let startX = 0, startY = 0;
      let currentRotatingSlogan = "ACT EARLY, PROTECT YOUR LIFE";
      let currentMascotIndex = 0;
      let mascotSide = 'right';

      // ---------- Assets ----------
      const hospitalLogo = new Image();
      hospitalLogo.src = 'shah_logo.png';
      hospitalLogo.onload = () => { if (currentMode === 'image') drawCanvas(0); };
      hospitalLogo.onerror = () => { /* silent fallback */ };

      const mascotSources = [
        'mascot_heart_1.png',
        'mascot_heart_2.png',
        'mascot_heart_3.png',
        'mascot_heart_4.png',
        'mascot_heart_5.png',
        'mascot_heart_6.png'
      ];
      let loadedMascots = [];
      let mascotsReady = false;

      // Load mascots
      let mascotLoadCount = 0;
      mascotSources.forEach((src, idx) => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
          loadedMascots[idx] = img;
          mascotLoadCount++;
          if (mascotLoadCount === mascotSources.length) mascotsReady = true;
          if (idx === 0 && currentMode === 'image') drawCanvas(0);
        };
        img.onerror = () => {
          mascotLoadCount++;
          if (mascotLoadCount === mascotSources.length) mascotsReady = true;
          // leave undefined — will fallback
        };
      });

      // Fallback mascot if none loaded
      const fallbackMascot = (() => {
        const c = document.createElement('canvas');
        c.width = 200; c.height = 200;
        const cx = c.getContext('2d');
        cx.fillStyle = '#ffb3b3';
        cx.beginPath();
        cx.arc(100, 100, 80, 0, 2 * Math.PI);
        cx.fill();
        cx.fillStyle = '#c81e1e';
        cx.font = 'bold 80px sans-serif';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText('❤️', 100, 100);
        return c;
      })();

      const bannerSloganText = "DON'T MISS A BEAT";
      const rotatingHeartbeatSlogans = [
        "ACT EARLY, PROTECT YOUR LIFE",
        "KNOW YOUR RISK FACTORS TODAY",
        "KEEP YOUR HEART HEALTHY & STRONG",
        "HEART DISEASE CAN HIDE IN PLAIN SIGHT",
        "USE HEART TO CONNECT & CARE"
      ];

      // ---------- Helper: pick random mascot ----------
      function randomizeMascot() {
        const available = loadedMascots
          .map((img, i) => (img && img.complete && img.naturalHeight !== 0) ? i : -1)
          .filter(i => i !== -1);

        if (available.length > 0) {
          currentMascotIndex = available[Math.floor(Math.random() * available.length)];
        } else {
          currentMascotIndex = Math.floor(Math.random() * mascotSources.length);
        }
        mascotSide = Math.random() > 0.5 ? 'right' : 'left';
      }

      // ---------- Draw Canvas (main render) ----------
      function drawCanvas(elapsedTime = 0) {
        const w = canvas.width;
        const h = canvas.height;

        ctx.clearRect(0, 0, w, h);

        // 1. Background
        const bgGrad = ctx.createRadialGradient(500, 500, 100, 500, 500, 800);
        bgGrad.addColorStop(0, '#f93154');
        bgGrad.addColorStop(0.6, '#d90429');
        bgGrad.addColorStop(1, '#7a0010');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        // 2. Central circle frame
        const circleRadius = 350;
        const circleX = 500;
        const circleY = 535;

        ctx.save();
        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.clip();

        if (userVideo && userVideo.readyState >= 2) {
          // video draw — cover circle
          const vw = userVideo.videoWidth;
          const vh = userVideo.videoHeight;
          if (vw && vh) {
            const vSize = Math.min(vw, vh) * photoScale;
            const vx = (vw - vSize) / 2 + photoOffsetX;
            const vy = (vh - vSize) / 2 + photoOffsetY;
            ctx.drawImage(
              userVideo,
              vx, vy, vSize, vSize,
              circleX - circleRadius, circleY - circleRadius,
              circleRadius * 2, circleRadius * 2
            );
          }
        } else if (userImage) {
          const baseSize = (circleRadius * 2) * photoScale;
          const x = circleX - (baseSize / 2) + photoOffsetX;
          const y = circleY - (baseSize / 2) + photoOffsetY;
          ctx.drawImage(userImage, x, y, baseSize, baseSize);
        } else {
          // placeholder
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.fillStyle = '#d90429';
          ctx.font = 'bold 32px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Tap below to', circleX, circleY - 18);
          ctx.fillText('upload media', circleX, circleY + 25);
        }
        ctx.restore();

        // 3. Overlay gradient on circle
        ctx.save();
        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.clip();
        const overlayGrad = ctx.createLinearGradient(0, circleY - circleRadius, 0, circleY + circleRadius);
        overlayGrad.addColorStop(0, 'rgba(122,0,16,0.45)');
        overlayGrad.addColorStop(0.5, 'rgba(217,4,41,0.25)');
        overlayGrad.addColorStop(1, 'rgba(122,0,16,0.55)');
        ctx.fillStyle = overlayGrad;
        ctx.fill();
        ctx.restore();

        // 4. Circle border
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.stroke();

        // 5. ECG line
        drawContinuousNormalEcg(elapsedTime);

        // 6. Mascot
        const activeMascot = loadedMascots[currentMascotIndex] || fallbackMascot;
        if (activeMascot && activeMascot.complete !== false) {
          const mHeight = 270;
          const mWidth = (activeMascot.width / activeMascot.height) * mHeight || 200;
          const mX = mascotSide === 'right' ? (canvas.width - mWidth - 25) : 25;
          const mY = 970 - mHeight;

          // backlight glow
          ctx.save();
          const backLight = ctx.createRadialGradient(
            mX + mWidth / 2, mY + mHeight / 2, 20,
            mX + mWidth / 2, mY + mHeight / 2, 140
          );
          backLight.addColorStop(0, 'rgba(255,255,255,0.85)');
          backLight.addColorStop(0.4, 'rgba(255,120,140,0.55)');
          backLight.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = backLight;
          ctx.beginPath();
          ctx.arc(mX + mWidth / 2, mY + mHeight / 2, 135, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.drawImage(activeMascot, mX, mY, mWidth, mHeight);
        }

        // 7. Header: logo + title
        const headerY = 22;
        let logoWidthRightEdge = 175;

        if (hospitalLogo.complete && hospitalLogo.naturalHeight !== 0) {
          const targetLogoHeight = 75;
          const logoWidth = (hospitalLogo.width / hospitalLogo.height) * targetLogoHeight;
          const pillPaddingX = 14;
          const pillPaddingY = 8;
          const pillWidth = logoWidth + pillPaddingX * 2;
          const pillHeight = targetLogoHeight + pillPaddingY * 2;
          const pillX = 35;
          const pillY = headerY;

          ctx.save();
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.shadowColor = 'rgba(0,0,0,0.25)';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.roundRect(pillX, pillY, pillWidth, pillHeight, 16);
          ctx.fill();
          ctx.restore();

          ctx.drawImage(hospitalLogo, pillX + pillPaddingX, pillY + pillPaddingY, logoWidth, targetLogoHeight);
          logoWidthRightEdge = pillX + pillWidth + 18;
        }

        const textStartX = logoWidthRightEdge;
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 38px sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 12;
        ctx.fillText('WORLD HEART DAY 2026', textStartX, headerY + 42);

        ctx.font = '900 35px sans-serif';
        ctx.fillStyle = '#ffe3e3';
        ctx.fillText(bannerSloganText, textStartX, headerY + 82);
        ctx.shadowBlur = 0;

        // 8. User name
        const nameText = userNameInput.value.trim() ? userNameInput.value.toUpperCase() : "";
        if (nameText) {
          ctx.textAlign = 'center';
          ctx.fillStyle = '#fff0f3';
          ctx.font = '900 28px sans-serif';
          ctx.shadowColor = 'rgba(0,0,0,0.6)';
          ctx.shadowBlur = 8;
          ctx.fillText(nameText, canvas.width / 2, 490, 650);
          ctx.shadowBlur = 0;
        }

        // 9. Rotating slogan
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 36px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.9)';
        ctx.shadowBlur = 12;
        wrapText(ctx, currentRotatingSlogan, canvas.width / 2, 835, 780, 42);

        // 10. Hashtags
        ctx.fillStyle = '#ffe3e3';
        ctx.font = '900 28px sans-serif';
        ctx.fillText('#DontMissABeat   #UseHeart', canvas.width / 2, 912);
        ctx.shadowBlur = 0;

        // 11. Credit
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '300 15px sans-serif';
        ctx.fillText('Developed by: Ahmed Shareef for Shaviyani Atoll Hospital', canvas.width / 2, 970);
      }

      // ---------- ECG drawing ----------
      function drawContinuousNormalEcg(elapsedTime) {
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(255,255,255,0.95)';
        ctx.shadowBlur = 14;
        ctx.beginPath();

        const ecgY = 665;
        const totalDuration = 10000;
        const progress = (currentMode === 'video') ? Math.min(1, elapsedTime / totalDuration) : 1.0;
        const maxVisibleX = canvas.width * progress;

        function getEcgOffset(t) {
          const cycleTime = 750;
          const localT = t % cycleTime;
          let val = 0;
          if (localT > 100 && localT < 220) {
            val -= 12 * Math.sin(((localT - 100) / 120) * Math.PI);
          } else if (localT >= 260 && localT < 290) {
            val += 18;
          } else if (localT >= 290 && localT < 340) {
            val -= 195 * Math.sin(((localT - 290) / 50) * Math.PI);
          } else if (localT >= 340 && localT < 380) {
            val += 45 * Math.sin(((localT - 340) / 40) * Math.PI);
          } else if (localT >= 460 && localT < 640) {
            val -= 28 * Math.sin(((localT - 460) / 180) * Math.PI);
          }
          return val;
        }

        let started = false;
        const timeShift = (currentMode === 'video') ? elapsedTime : (performance.now() * 0.4);
        const endX = (currentMode === 'video') ? maxVisibleX : canvas.width;

        for (let x = 0; x <= endX; x += 3) {
          const t = x * 2.2 + timeShift;
          const y = ecgY + getEcgOffset(t);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // ---------- Text wrap ----------
      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          if (context.measureText(testLine).width > maxWidth && n > 0) {
            context.fillText(line, x, currentY);
            line = words[n] + ' ';
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, currentY);
      }

      // ---------- File handling (unified) ----------
      function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        photoOffsetX = 0;
        photoOffsetY = 0;

        if (file.type.startsWith('video/')) {
          // video
          if (userImage) { userImage = null; }
          if (userVideo) { userVideo.pause(); userVideo.src = ''; }
          userVideo = document.createElement('video');
          userVideo.src = URL.createObjectURL(file);
          userVideo.loop = true;
          userVideo.muted = true;
          userVideo.playsInline = true;
          userVideo.crossOrigin = 'anonymous';
          userVideo.play().catch(() => {});
          userVideo.onloadeddata = () => {
            if (currentMode === 'image') drawCanvas(0);
          };
        } else {
          // image
          if (userVideo) { userVideo.pause(); userVideo.src = ''; userVideo = null; }
          const reader = new FileReader();
          reader.onload = (ev) => {
            userImage = new Image();
            userImage.src = ev.target.result;
            userImage.onload = () => {
              if (currentMode === 'image') drawCanvas(0);
            };
          };
          reader.readAsDataURL(file);
        }
      }

      // Attach file input listener (single, permanent)
      imageUpload.addEventListener('change', handleFileSelect);

      // ---------- Drag / pan support ----------
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - photoOffsetX;
        startY = e.clientY - photoOffsetY;
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        photoOffsetX = e.clientX - startX;
        photoOffsetY = e.clientY - startY;
        if (currentMode === 'image') drawCanvas(0);
      });
      window.addEventListener('mouseup', () => { isDragging = false; });

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - photoOffsetX;
          startY = e.touches[0].clientY - photoOffsetY;
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          photoOffsetX = e.touches[0].clientX - startX;
          photoOffsetY = e.touches[0].clientY - startY;
          if (currentMode === 'image') drawCanvas(0);
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchend', () => { isDragging = false; });
      canvas.addEventListener('touchcancel', () => { isDragging = false; });

      // ---------- UI listeners ----------
      zoomRange.addEventListener('input', (e) => {
        photoScale = parseFloat(e.target.value);
        if (currentMode === 'image') drawCanvas(0);
      });

      userNameInput.addEventListener('input', () => {
        if (currentMode === 'image') drawCanvas(0);
      });

      shuffleBtn.addEventListener('click', () => {
        const currentIndex = rotatingHeartbeatSlogans.indexOf(currentRotatingSlogan);
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * rotatingHeartbeatSlogans.length);
        } while (nextIndex === currentIndex && rotatingHeartbeatSlogans.length > 1);
        currentRotatingSlogan = rotatingHeartbeatSlogans[nextIndex];
        randomizeMascot();
        if (currentMode === 'image') drawCanvas(0);
      });

      // ---------- Mode switching ----------
      window.switchMode = function(mode) {
        currentMode = mode;
        if (animationId) cancelAnimationFrame(animationId);
        lastRecordedVideoBlob = null;

        document.getElementById('modeImageBtn').classList.toggle('active', mode === 'image');
        document.getElementById('modeVideoBtn').classList.toggle('active', mode === 'video');

        if (mode === 'image') {
          videoStatus.style.display = 'none';
          actionDownloadBtn.textContent = '💾 Save Image';
          actionShareBtn.textContent = '📤 Share Card';
          uploadBtnText.textContent = '📸 Shoot / Select Photo';
          imageUpload.accept = 'image/*';
          // Reset video objects
          if (userVideo) { userVideo.pause(); userVideo = null; }
          drawCanvas(0);
        } else {
          videoStatus.style.display = 'block';
          videoStatus.textContent = '🎥 10s MP4 Video Mode Active (ECG + audio)';
          actionDownloadBtn.textContent = '📥 Export MP4';
          actionShareBtn.textContent = '📤 Share MP4';
          uploadBtnText.textContent = '🎬 Record / Select Video';
          imageUpload.accept = 'video/*';
          // Reset image
          userImage = null;
          recordingStartTime = performance.now();
          startVideoPreviewLoop();
        }
        // Clear file input value so same file can be re-selected
        imageUpload.value = '';
      };

      // ---------- Video preview loop ----------
      function startVideoPreviewLoop() {
        function loop(timestamp) {
          if (currentMode !== 'video') return;
          const elapsed = timestamp - recordingStartTime;
          drawCanvas(elapsed);
          if (elapsed < 10000) {
            animationId = requestAnimationFrame(loop);
          } else {
            videoStatus.textContent = '✅ 10s preview finished — tap Export MP4';
          }
        }
        animationId = requestAnimationFrame(loop);
      }

      // ---------- Download / Share ----------
      actionDownloadBtn.addEventListener('click', async () => {
        if (currentMode === 'image') {
          // Save image
          const link = document.createElement('a');
          link.download = 'world-heart-day-2026.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else {
          // Export MP4
          if (!window.MediaRecorder) {
            alert('Video recording is not supported on this browser.');
            return;
          }

          if (lastRecordedVideoBlob) {
            downloadVideoBlob(lastRecordedVideoBlob);
            return;
          }

          videoStatus.style.display = 'block';
          videoStatus.textContent = '🎥 Recording 10s MP4 video... Please wait.';

          recordingStartTime = performance.now();
          const stream = canvas.captureStream(30);

          try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const dest = audioCtx.createMediaStreamDestination();

            const interval = setInterval(() => {
              if (audioCtx.state === 'suspended') audioCtx.resume();
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(120, audioCtx.currentTime);
              gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
              osc.connect(gain);
              gain.connect(dest);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.12);
            }, 750);

            const combinedStream = new MediaStream([
              ...stream.getVideoTracks(),
              ...dest.stream.getAudioTracks()
            ]);

            let mime = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
            if (!MediaRecorder.isTypeSupported(mime)) {
              mime = 'video/mp4';
              if (!MediaRecorder.isTypeSupported(mime)) {
                mime = 'video/webm;codecs=h264,opus';
              }
            }

            const recorder = new MediaRecorder(combinedStream, { mimeType: mime });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
              clearInterval(interval);
              lastRecordedVideoBlob = new Blob(chunks, { type: 'video/mp4' });
              downloadVideoBlob(lastRecordedVideoBlob);
              videoStatus.textContent = '✅ 10s video saved as MP4!';
            };

            recorder.start();
            startVideoPreviewLoop();

            setTimeout(() => {
              if (recorder.state !== 'inactive') recorder.stop();
            }, 10000);

          } catch (err) {
            console.error(err);
            alert('MP4 Video export error: ' + err.message);
            videoStatus.style.display = 'none';
          }
        }
      });

      function downloadVideoBlob(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'world-heart-day-2026-clip.mp4';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      actionShareBtn.addEventListener('click', async () => {
        if (currentMode === 'image') {
          const dataUrl = canvas.toDataURL('image/png');
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], 'world-heart-day-2026.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'World Heart Day 2026',
                text: `${bannerSloganText} — ${currentRotatingSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                files: [file]
              });
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('Share failed', err);
            }
          } else {
            alert('Direct sharing is not supported here. Please use "Save Image" instead.');
          }
        } else {
          if (!lastRecordedVideoBlob) {
            alert('Please click "Export MP4" first to record the 10s clip before sharing.');
            return;
          }

          const videoFile = new File([lastRecordedVideoBlob], 'world-heart-day-2026-clip.mp4', { type: 'video/mp4' });

          if (navigator.canShare && navigator.canShare({ files: [videoFile] })) {
            try {
              await navigator.share({
                title: 'World Heart Day 2026 Video Clip',
                text: `${bannerSloganText} — ${currentRotatingSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                files: [videoFile]
              });
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('Share failed', err);
            }
          } else {
            alert('Direct video sharing is not supported. Your MP4 was saved to downloads.');
          }
        }
      });

      // ---------- Init ----------
      // Set random mascot initially
      randomizeMascot();
      // First draw
      drawCanvas(0);

      // Re-draw when mascots finish loading
      window.addEventListener('load', () => {
        if (currentMode === 'image') drawCanvas(0);
      });

    })();
  </script>
</body>
</html>
