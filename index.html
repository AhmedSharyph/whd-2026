<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WHD Creator">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <title>WHD 2026 · Creator Studio</title>
  <style>
    /* ============ RESET ============ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      touch-action: manipulation;
      background: #ffffff;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: #ffffff;
    }

    /* ============ APP SHELL — CLEAN LIGHT ============ */
    .app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, #fff8f9 0%, #ffffff 40%, #ffffff 100%);
      z-index: 1;
    }

    /* ============ SCROLL AREA ============ */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overscroll-behavior: contain;
      background: transparent;
      scrollbar-width: none;
    }
    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* ============ HEADER ============ */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 4px 8px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff2d55, #d90429);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 8px 18px rgba(255, 45, 85, 0.25);
    }

    .brand-text h1 {
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #7a0010;
      line-height: 1.1;
    }

    .brand-text .sub {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #d90429;
      margin-top: 2px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 20px;
      background: rgba(255, 45, 85, 0.08);
      border: 1px solid rgba(255, 45, 85, 0.2);
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d90429;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff2d55;
      box-shadow: 0 0 8px rgba(255, 45, 85, 0.6);
      animation: livePulse 1.6s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }

    /* ============ MODE TABS — LIGHT PILL ============ */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: #f5f5f7;
      padding: 5px;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px 8px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #8a6a70;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.28s cubic-bezier(0.2, 0.9, 0.4, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #ff2d55, #d90429);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(255, 45, 85, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    /* ============ CANVAS FRAME — 9:16 VERTICAL STORY RATIO ============ */
    .canvas-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: 26px;
      overflow: hidden;
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.06);
      box-shadow: 
        0 12px 34px rgba(217, 4, 41, 0.12),
        0 2px 6px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      padding: 8px;
      box-sizing: border-box;
      max-height: 52vh;
      margin: 0 auto;
    }

    .canvas-frame .hearts-layer {
      position: absolute;
      inset: 8px;
      border-radius: 19px;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .canvas-frame .hearts-layer .heart {
      position: absolute;
      top: -30px;
      font-size: 14px;
      opacity: 0;
      animation: heartFall linear infinite;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 3px rgba(255, 100, 130, 0.5));
    }

    @keyframes heartFall {
      0% {
        transform: translateY(-30px) translateX(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      12% { opacity: 0.9; }
      50% { opacity: 0.7; }
      88% { opacity: 0.35; }
      100% {
        transform: translateY(110%) translateX(var(--drift, 24px)) rotate(340deg) scale(1);
        opacity: 0;
      }
    }

    .canvas-frame canvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 19px;
      touch-action: none;
    }

    /* ============ UPLOAD SECTION — CAMERA + GALLERY ============ */
    .upload-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .upload-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .upload-label-row .label-text {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8a6a70;
    }

    .upload-label-row .media-type-badge {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #d90429;
      background: rgba(255, 45, 85, 0.08);
      border: 1px solid rgba(255, 45, 85, 0.2);
      padding: 3px 9px;
      border-radius: 8px;
    }

    .upload-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .upload-action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 16px 10px;
      border-radius: 18px;
      border: 1.5px solid rgba(255, 45, 85, 0.15);
      background: #ffffff;
      color: #7a0010;
      font-weight: 700;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      font-family: inherit;
      text-align: center;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(217, 4, 41, 0.06);
    }

    .upload-action-btn .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 45, 85, 0.12), rgba(217, 4, 41, 0.08));
      border: 1px solid rgba(255, 45, 85, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: transform 0.2s;
    }

    .upload-action-btn:active {
      transform: scale(0.97);
      background: #fff5f7;
      border-color: rgba(255, 45, 85, 0.4);
    }

    .upload-action-btn:active .icon-circle {
      transform: scale(1.1);
    }

    .upload-action-btn input[type="file"] {
      display: none;
    }

    /* ============ FIELD GROUPS ============ */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .field-label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8a6a70;
      padding: 0 4px;
      -webkit-user-select: none;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .field-label .value-badge {
      font-size: 0.6rem;
      font-weight: 700;
      color: #d90429;
      background: rgba(255, 45, 85, 0.08);
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 45, 85, 0.15);
    }

    /* ============ RANGE SLIDER — LIGHT ============ */
    .range-wrapper {
      width: 100%;
      padding: 0 2px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #f0e0e5;
      border-radius: 6px;
      outline: none;
      margin: 4px 0;
      touch-action: manipulation;
      cursor: pointer;
      border: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2d55, #b3001b);
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 45, 85, 0.4), 0 0 0 3px rgba(255, 45, 85, 0.1);
      border: 2.5px solid #ffffff;
      transition: transform 0.12s;
      touch-action: manipulation;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.18);
    }

    input[type="range"]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff2d55, #b3001b);
      cursor: pointer;
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(255, 45, 85, 0.4);
    }

    /* ============ TEXT INPUT — LIGHT ============ */
    input[type="text"] {
      width: 100%;
      padding: 15px 16px;
      border-radius: 16px;
      border: 1.5px solid rgba(0, 0, 0, 0.06);
      background: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      color: #1a1a1a;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    input[type="text"]:focus {
      border-color: #ff2d55;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 45, 85, 0.1);
    }

    input[type="text"]::placeholder {
      color: #b8a0a5;
      font-weight: 400;
    }

    /* ============ BUTTONS ============ */
    .btn {
      width: 100%;
      padding: 16px 12px;
      border-radius: 18px;
      border: none;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      color: #ffffff;
      flex-shrink: 0;
      font-family: inherit;
      letter-spacing: 0.01em;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), transparent 55%);
      pointer-events: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-shuffle {
      background: #ffffff;
      border: 1.5px solid rgba(255, 45, 85, 0.2);
      color: #7a0010;
      font-size: 0.82rem;
      box-shadow: 0 4px 12px rgba(217, 4, 41, 0.06);
    }

    .btn-shuffle::before {
      background: linear-gradient(180deg, rgba(255, 240, 243, 0.5), transparent 55%);
    }

    .btn-shuffle:active {
      background: #fff5f7;
      border-color: rgba(255, 45, 85, 0.4);
    }

    .btn-download {
      background: linear-gradient(135deg, #2b2b30, #000000);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .btn-share {
      background: linear-gradient(135deg, #ff2d55, #d90429);
      box-shadow: 0 8px 20px rgba(255, 45, 85, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ============ VIDEO STATUS ============ */
    .video-status {
      font-size: 0.72rem;
      font-weight: 600;
      color: #b3001b;
      text-align: center;
      background: #fff5f7;
      padding: 12px 14px;
      border-radius: 14px;
      display: none;
      border: 1px solid rgba(255, 45, 85, 0.18);
      flex-shrink: 0;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .video-status.visible {
      display: block;
      animation: fadeIn 0.3s ease both;
    }

    /* ============ FOOTER ============ */
    .app-footer {
      text-align: center;
      font-size: 0.56rem;
      color: #b8a0a5;
      font-weight: 500;
      padding: 8px 0 4px;
      flex-shrink: 0;
      letter-spacing: 0.04em;
    }

    /* ============ SAFE AREA ============ */
    @supports (padding: env(safe-area-inset-bottom)) {
      .scroll-area {
        padding-bottom: calc(32px + env(safe-area-inset-bottom));
        padding-top: calc(16px + env(safe-area-inset-top));
      }
      .app-header {
        padding-top: calc(4px + env(safe-area-inset-top));
      }
      .app-footer {
        padding-bottom: calc(4px + env(safe-area-inset-bottom));
      }
    }

    /* ============ SMALL PHONES ============ */
    @media (max-height: 720px) {
      .scroll-area {
        gap: 10px;
        padding: 12px 14px 24px;
      }
      .canvas-frame {
        border-radius: 20px;
        padding: 6px;
        max-height: 44vh;
      }
      .canvas-frame .hearts-layer,
      .canvas-frame canvas {
        border-radius: 15px;
      }
      .upload-action-btn {
        padding: 13px 8px;
        font-size: 0.68rem;
      }
      .upload-action-btn .icon-circle {
        width: 32px;
        height: 32px;
        font-size: 15px;
      }
      .btn {
        padding: 14px 10px;
        font-size: 0.8rem;
      }
      input[type="text"] {
        padding: 13px 14px;
        font-size: 0.86rem;
      }
      .tab-btn {
        padding: 11px 6px;
        font-size: 0.72rem;
      }
    }

    /* ============ TEXT SELECTION ============ */
    .app, .app * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input[type="text"] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    body {
      overscroll-behavior-y: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-area > * {
      animation: fadeIn 0.35s cubic-bezier(0.2, 0.9, 0.4, 1) both;
    }

    .scroll-area > *:nth-child(2) { animation-delay: 0.04s; }
    .scroll-area > *:nth-child(3) { animation-delay: 0.08s; }
    .scroll-area > *:nth-child(4) { animation-delay: 0.12s; }
    .scroll-area > *:nth-child(5) { animation-delay: 0.16s; }
    .scroll-area > *:nth-child(6) { animation-delay: 0.20s; }
    .scroll-area > *:nth-child(7) { animation-delay: 0.24s; }
    .scroll-area > *:nth-child(8) { animation-delay: 0.28s; }
    .scroll-area > *:nth-child(9) { animation-delay: 0.32s; }
  </style>
</head>
<body>

  <div class="app" id="app">
    <div class="scroll-area" id="scrollArea">

      <!-- HEADER -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark">❤️</div>
          <div class="brand-text">
            <h1>SHAH HEALTH PORTAL</h1>
            <div class="sub">World Heart Day 2026</div>
          </div>
        </div>
        <div class="live-badge">
          <span class="live-dot"></span>
          Story Studio
        </div>
      </header>

      <!-- MODE SWITCH -->
      <div class="mode-tabs" id="modeTabs">
        <button class="tab-btn active" id="modeImageBtn" onclick="switchMode('image')" aria-label="Photo story mode">
          📷 Photo Story
        </button>
        <button class="tab-btn" id="modeVideoBtn" onclick="switchMode('video')" aria-label="10 second story video mode">
          🎥 10s Story Video
        </button>
      </div>

      <!-- CANVAS FRAME — 9:16 VERTICAL RATIO -->
      <div class="canvas-frame" id="canvasFrame">
        <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>
        <canvas id="creatorCanvas" width="1080" height="1920"></canvas>
      </div>

      <!-- UPLOAD SECTION — CAMERA + GALLERY (BOTH MODES) -->
      <div class="upload-section">
        <div class="upload-label-row">
          <span class="label-text">Add your media</span>
          <span class="media-type-badge" id="mediaTypeBadge">Photo</span>
        </div>
        <div class="upload-actions">
          <!-- Camera button -->
          <button class="upload-action-btn" id="cameraBtn" type="button">
            <span class="icon-circle">📸</span>
            <span id="cameraBtnText">Take Photo</span>
          </button>
          <!-- Gallery button -->
          <button class="upload-action-btn" id="galleryBtn" type="button">
            <span class="icon-circle">🖼️</span>
            <span id="galleryBtnText">Choose Photo</span>
          </button>
        </div>
        <!-- Hidden file inputs — one for camera, one for gallery -->
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <input type="file" id="galleryInput" accept="image/*" style="display:none;">
      </div>

      <!-- ZOOM -->
      <div class="field-group">
        <div class="field-label">
          <span>Zoom & drag inside vertical oval</span>
          <span class="value-badge" id="zoomValue">1.0×</span>
        </div>
        <div class="range-wrapper">
          <input type="range" id="zoomRange" min="0.5" max="3.0" step="0.05" value="1">
        </div>
      </div>

      <!-- NAME -->
      <div class="field-group">
        <label class="field-label" for="userName">
          <span>Your name / team (optional)</span>
        </label>
        <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
      </div>

      <!-- SHUFFLE -->
      <button class="btn btn-shuffle" id="shuffleBtn">🔄 Shuffle Slogan & Mascot</button>

      <!-- VIDEO STATUS -->
      <div class="video-status" id="videoStatus"></div>

      <!-- ACTION BUTTONS -->
      <div class="btn-group">
        <button class="btn btn-download" id="actionDownloadBtn">💾 Save Story</button>
        <button class="btn btn-share" id="actionShareBtn">📤 Share Story</button>
      </div>

      <!-- FOOTER -->
      <div class="app-footer">Developed by Ahmed Shareef · Shaviyani Atoll Hospital</div>

    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ============ HEART CASCADE ============
      (function generateHearts() {
        const layer = document.getElementById('heartsLayer');
        const heartChars = ['❤', '♥', '❤️', '💗', '💓'];
        const colors = [
          'rgba(255, 160, 180, 0.85)',
          'rgba(255, 120, 150, 0.8)',
          'rgba(255, 190, 205, 0.75)',
          'rgba(255, 100, 130, 0.7)',
          'rgba(255, 210, 220, 0.7)'
        ];
        const count = 20;

        for (let i = 0; i < count; i++) {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
          const size = 8 + Math.random() * 16;
          const duration = 8 + Math.random() * 12;
          const delay = Math.random() * 12;
          const left = Math.random() * 100;
          const drift = (Math.random() * 70 - 35).toFixed(0) + 'px';
          const color = colors[Math.floor(Math.random() * colors.length)];

          heart.style.left = left + '%';
          heart.style.fontSize = size + 'px';
          heart.style.color = color;
          heart.style.animationDuration = duration + 's';
          heart.style.animationDelay = '-' + delay + 's';
          heart.style.setProperty('--drift', drift);
          layer.appendChild(heart);
        }
      })();

      // ============ DOM REFS ============
      const canvas = document.getElementById('creatorCanvas');
      const ctx = canvas.getContext('2d');
      const scrollArea = document.getElementById('scrollArea');
      const userNameInput = document.getElementById('userName');
      const zoomRange = document.getElementById('zoomRange');
      const zoomValue = document.getElementById('zoomValue');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const actionDownloadBtn = document.getElementById('actionDownloadBtn');
      const actionShareBtn = document.getElementById('actionShareBtn');
      const videoStatus = document.getElementById('videoStatus');
      const modeImageBtn = document.getElementById('modeImageBtn');
      const modeVideoBtn = document.getElementById('modeVideoBtn');
      const mediaTypeBadge = document.getElementById('mediaTypeBadge');
      const cameraBtn = document.getElementById('cameraBtn');
      const galleryBtn = document.getElementById('galleryBtn');
      const cameraBtnText = document.getElementById('cameraBtnText');
      const galleryBtnText = document.getElementById('galleryBtnText');
      const cameraInput = document.getElementById('cameraInput');
      const galleryInput = document.getElementById('galleryInput');

      // ============ STATE ============
      let userImage = null;
      let userVideo = null;
      let photoScale = 1;
      let photoOffsetX = 0;
      let photoOffsetY = 0;
      let currentMode = 'image';
      let animationId = null;
      let recordingStartTime = 0;
      let lastRecordedVideoBlob = null;
      let isDragging = false;
      let startX = 0, startY = 0;
      let currentRotatingSlogan = "ACT EARLY, PROTECT YOUR LIFE";
      let currentMascotIndex = 0;
      let mascotSide = 'right';
      let lastDrawTime = 0;

      // ============ TEXT ANIMATIONS (video mode) ============
      let textAnimations = {
        title: null, curvedSlogan: null, rotatingSlogan: null,
        hashtags: null, name: null, credit: null
      };

      const animationPool = [
        'fadeIn', 'slideFromLeft', 'slideFromRight', 'slideFromTop',
        'slideFromBottom', 'scaleUp', 'scaleDown', 'wave', 'pulse',
        'glow', 'rotateIn', 'bounceIn', 'flipIn'
      ];

      function randomizeTextAnimations() {
        const pick = () => animationPool[Math.floor(Math.random() * animationPool.length)];
        textAnimations.title = pick();
        textAnimations.curvedSlogan = pick();
        textAnimations.rotatingSlogan = pick();
        textAnimations.hashtags = pick();
        textAnimations.name = pick();
        textAnimations.credit = pick();
      }

      function getAnimProgress(elapsed, delay, duration) {
        if (elapsed < delay) return 0;
        return Math.min(1, (elapsed - delay) / duration);
      }

      function getAnimState(animName, progress) {
        const state = { alpha: 1, offsetX: 0, offsetY: 0, scale: 1, rotate: 0, glow: 0 };
        const p = progress;
        switch (animName) {
          case 'fadeIn':          state.alpha = p; break;
          case 'slideFromLeft':   state.offsetX = -180 * (1 - p); state.alpha = p; break;
          case 'slideFromRight':  state.offsetX = 180 * (1 - p);  state.alpha = p; break;
          case 'slideFromTop':    state.offsetY = -120 * (1 - p); state.alpha = p; break;
          case 'slideFromBottom': state.offsetY = 120 * (1 - p);  state.alpha = p; break;
          case 'scaleUp':         state.scale = 0.3 + 0.7 * p;    state.alpha = p; break;
          case 'scaleDown':       state.scale = 1.6 - 0.6 * p;    state.alpha = p; break;
          case 'wave':            state.offsetY = Math.sin(p * Math.PI * 4) * 18 * (1 - p); state.alpha = Math.min(1, p * 2); break;
          case 'pulse':           state.scale = 1 + Math.sin(p * Math.PI * 6) * 0.12 * (1 - p); state.alpha = Math.min(1, p * 1.5); break;
          case 'glow':            state.glow = Math.sin(p * Math.PI * 5) * 22; state.alpha = Math.min(1, p * 2); break;
          case 'rotateIn':        state.rotate = -Math.PI * 0.6 * (1 - p); state.scale = 0.4 + 0.6 * p; state.alpha = p; break;
          case 'bounceIn':
            if (p < 0.7) {
              const tt = p / 0.7;
              state.scale = 0.3 + 1.0 * tt - 0.3 * Math.sin(tt * Math.PI);
            } else { state.scale = 1; }
            state.alpha = Math.min(1, p * 1.8);
            break;
          case 'flipIn':          state.scale = 0.1 + 0.9 * p; state.rotate = Math.PI * (1 - p); state.alpha = p; break;
        }
        return state;
      }

      // ============ ASSETS ============
      const hospitalLogo = new Image();
      hospitalLogo.src = 'shah_logo.png';
      hospitalLogo.onload = () => { if (currentMode === 'image') scheduleDraw(); };
      hospitalLogo.onerror = () => {};

      const mascotSources = [
        'mascot_heart_1.png', 'mascot_heart_2.png', 'mascot_heart_3.png',
        'mascot_heart_4.png', 'mascot_heart_5.png', 'mascot_heart_6.png'
      ];
      let loadedMascots = [];
      let mascotLoadCount = 0;

      mascotSources.forEach((src, idx) => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
          loadedMascots[idx] = img;
          mascotLoadCount++;
          if (idx === 0 && currentMode === 'image') scheduleDraw();
        };
        img.onerror = () => { mascotLoadCount++; };
      });

      const fallbackMascot = (() => {
        const c = document.createElement('canvas');
        c.width = 200; c.height = 200;
        const cx = c.getContext('2d');
        cx.fillStyle = '#ffb3b3';
        cx.beginPath();
        cx.arc(100, 100, 80, 0, 2 * Math.PI);
        cx.fill();
        cx.fillStyle = '#c81e1e';
        cx.font = 'bold 80px sans-serif';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText('❤️', 100, 100);
        return c;
      })();

      const bannerSloganText = "DON'T MISS A BEAT";
      const rotatingHeartbeatSlogans = [
        "ACT EARLY, PROTECT YOUR LIFE",
        "KNOW YOUR RISK FACTORS TODAY",
        "KEEP YOUR HEART HEALTHY & STRONG",
        "HEART DISEASE CAN HIDE IN PLAIN SIGHT",
        "USE HEART TO CONNECT & CARE"
      ];

      // ============ TILEABLE RED HEART PATTERN ============
      let heartPatternCanvas = null;
      function createHeartPattern() {
        if (heartPatternCanvas) return heartPatternCanvas;
        const pc = document.createElement('canvas');
        pc.width = 90;
        pc.height = 90;
        const pctx = pc.getContext('2d');

        // Base red tile background
        pctx.fillStyle = '#d90429';
        pctx.fillRect(0, 0, 90, 90);

        // Subtle gradient overlay for depth
        const grad = pctx.createLinearGradient(0, 0, 90, 90);
        grad.addColorStop(0, 'rgba(255, 45, 85, 0.35)');
        grad.addColorStop(1, 'rgba(100, 0, 10, 0.35)');
        pctx.fillStyle = grad;
        pctx.fillRect(0, 0, 90, 90);

        // Draw small subtle tiled hearts
        pctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        pctx.font = '22px sans-serif';
        pctx.textAlign = 'center';
        pctx.textBaseline = 'middle';

        // Tiled heart positions
        const coords = [
          {x: 22, y: 22, rot: -0.2},
          {x: 68, y: 22, rot: 0.15},
          {x: 45, y: 68, rot: 0.05}
        ];

        coords.forEach(c => {
          pctx.save();
          pctx.translate(c.x, c.y);
          pctx.rotate(c.rot);
          pctx.fillText('❤', 0, 0);
          pctx.restore();
        });

        heartPatternCanvas = pc;
        return pc;
      }

      // ============ DRAW SCHEDULER ============
      let drawScheduled = false;
      function scheduleDraw() {
        if (drawScheduled) return;
        drawScheduled = true;
        requestAnimationFrame(() => {
          drawScheduled = false;
          drawCanvas(0);
        });
      }

      // ============ RANDOM MASCOT ============
      function randomizeMascot() {
        const available = loadedMascots
          .map((img, i) => (img && img.complete && img.naturalHeight !== 0) ? i : -1)
          .filter(i => i !== -1);
        if (available.length > 0) {
          currentMascotIndex = available[Math.floor(Math.random() * available.length)];
        } else {
          currentMascotIndex = Math.floor(Math.random() * mascotSources.length);
        }
        mascotSide = 'right';
      }

      // ============ VERTICAL OVAL PATH HELPER ============
      function traceVerticalOvalPath(ctx, cx, cy, rx, ry) {
        ctx.beginPath();
        if (ctx.ellipse) {
          ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        } else {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(rx / ry, 1);
          ctx.arc(0, 0, ry, 0, Math.PI * 2);
          ctx.restore();
        }
      }

      // ============ CURVED TEXT AROUND VERTICAL OVAL ============
      function drawCurvedText(text, cx, cy, rx, ry, options, animState) {
        const {
          fontSize = 52, fontWeight = '900',
          fontFamily = '-apple-system, sans-serif',
          fillStyle = '#ffe3e3', shadowColor = 'rgba(0,0,0,0.9)',
          shadowBlur = 16, letterSpacing = 4
        } = options || {};
        const state = animState || { alpha: 1, offsetX: 0, offsetY: 0, scale: 1, rotate: 0, glow: 0 };

        ctx.save();
        ctx.globalAlpha = state.alpha;
        ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = fillStyle;
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = shadowBlur + (state.glow || 0);

        const chars = text.split('');
        const charWidths = chars.map(ch => {
          const w = ctx.measureText(ch).width;
          return w + (letterSpacing || 0);
        });
        const totalWidth = charWidths.reduce((a, b) => a + b, 0);
        const perimeter = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
        const stringAngleSpan = (totalWidth / perimeter) * (2 * Math.PI);
        const stringCenterAngle = -Math.PI / 2;
        const stringStartAngle = stringCenterAngle - stringAngleSpan / 2;

        let currentAngle = stringStartAngle;
        for (let i = 0; i < chars.length; i++) {
          const ch = chars[i];
          const chWidth = charWidths[i];
          const chAngleSpan = (chWidth / perimeter) * (2 * Math.PI);
          const charAngle = currentAngle + chAngleSpan / 2;
          
          const x = cx + rx * Math.cos(charAngle) + (state.offsetX || 0);
          const y = cy + ry * Math.sin(charAngle) + (state.offsetY || 0);

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(charAngle + Math.PI / 2 + (state.rotate || 0));
          if (state.scale !== 1) ctx.scale(state.scale, state.scale);
          ctx.fillText(ch, 0, 0);
          ctx.restore();
          currentAngle += chAngleSpan;
        }
        ctx.restore();
      }

      function withAnimation(animName, elapsed, delay, duration, drawFn) {
        if (currentMode !== 'video' || !animName) {
          drawFn({ alpha: 1, offsetX: 0, offsetY: 0, scale: 1, rotate: 0, glow: 0 });
          return;
        }
        const progress = getAnimProgress(elapsed, delay, duration);
        drawFn(getAnimState(animName, progress));
      }

      // ============ DRAW MASCOT ============
      function drawMascot() {
        const activeMascot = loadedMascots[currentMascotIndex] || fallbackMascot;
        if (!activeMascot || activeMascot.complete === false) return;
        const baseHeight = 220;
        const aspect = (activeMascot.width && activeMascot.height)
          ? (activeMascot.width / activeMascot.height) : 1;
        const baseWidth = baseHeight * aspect;

        const finalX = canvas.width - baseWidth - 45;
        const finalY = 1860 - baseHeight;

        ctx.save();
        ctx.globalAlpha = 1;
        ctx.drawImage(activeMascot, finalX, finalY, baseWidth, baseHeight);
        ctx.restore();
      }

      // ============ MAIN DRAW ============
      function drawCanvas(elapsedTime) {
        const w = canvas.width;
        const h = canvas.height;
        const now = performance.now();
        if (now - lastDrawTime < 16 && elapsedTime === 0) return;
        lastDrawTime = now;

        const isVideo = (currentMode === 'video');
        const t = elapsedTime || 0;

        ctx.clearRect(0, 0, w, h);

        // 1. Tiled Heart Pattern Background
        const patternImg = createHeartPattern();
        const pattern = ctx.createPattern(patternImg, 'repeat');
        ctx.fillStyle = pattern;
        ctx.fillRect(0, 0, w, h);

        // 2. Vertical Oval Dimensions (Shifted slightly upward to give ample space for bottom text & ECG)
        const ovalRx = 380;
        const ovalRy = 510;
        const ovalX = 540;
        const ovalY = 730;

        // Clip to Vertical Oval
        ctx.save();
        traceVerticalOvalPath(ctx, ovalX, ovalY, ovalRx, ovalRy);
        ctx.clip();

        if (userVideo && userVideo.readyState >= 2) {
          const vw = userVideo.videoWidth;
          const vh = userVideo.videoHeight;
          if (vw && vh) {
            const sourceAspect = vw / vh;
            let drawWidth = ovalRx * 2 * photoScale;
            let drawHeight = ovalRy * 2 * photoScale;
            if (sourceAspect > 1) {
              drawWidth = drawHeight * sourceAspect;
            } else {
              drawHeight = drawWidth / sourceAspect;
            }
            const vx = ovalX - (drawWidth / 2) + photoOffsetX;
            const vy = ovalY - (drawHeight / 2) + photoOffsetY;
            ctx.drawImage(userVideo, vx, vy, drawWidth, drawHeight);
          }
        } else if (userImage) {
          const iw = userImage.naturalWidth || userImage.width;
          const ih = userImage.naturalHeight || userImage.height;
          const sourceAspect = iw / ih;
          let drawWidth = ovalRx * 2 * photoScale;
          let drawHeight = ovalRy * 2 * photoScale;
          if (sourceAspect > 1) {
            drawWidth = drawHeight * sourceAspect;
          } else {
            drawHeight = drawWidth / sourceAspect;
          }
          const x = ovalX - (drawWidth / 2) + photoOffsetX;
          const y = ovalY - (drawHeight / 2) + photoOffsetY;
          ctx.drawImage(userImage, x, y, drawWidth, drawHeight);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.fillStyle = '#d90429';
          ctx.font = 'bold 42px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Tap below to', ovalX, ovalY - 20);
          ctx.fillText('add your media', ovalX, ovalY + 30);
        }
        ctx.restore();

        // 3. Vertical Oval Border
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 14;
        traceVerticalOvalPath(ctx, ovalX, ovalY, ovalRx, ovalRy);
        ctx.stroke();

        // 4. ECG (Positioned safely below the expanded oval base)
        drawContinuousNormalEcg(elapsedTime);

        // 5. Mascot
        drawMascot();

        // 6. Header Title & Date
        const headerY = 110;
        const textCenterX = w / 2;

        withAnimation(textAnimations.title, t, 100, 900, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const sc = state.scale, rot = state.rotate, glow = state.glow;
          if (sc !== 1 || rot !== 0) {
            ctx.translate(textCenterX, headerY + 24);
            ctx.rotate(rot); ctx.scale(sc, sc);
            ctx.translate(-textCenterX, -(headerY + 24));
          }
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 58px -apple-system, sans-serif';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 14 + glow;
          ctx.fillText('WORLD HEART DAY 2026', textCenterX + ox, headerY + 24 + oy);
          ctx.restore();
        });

        // Date below title
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffe3e3';
        ctx.font = '700 28px -apple-system, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 8;
        ctx.fillText('29 September 2026', textCenterX, headerY + 74);
        ctx.restore();

        // 7. "DON'T MISS A BEAT" curved around the vertical oval top
        withAnimation(textAnimations.curvedSlogan, t, 500, 1000, (state) => {
          drawCurvedText(bannerSloganText, ovalX, ovalY, ovalRx + 44, ovalRy + 44, {
            fontSize: 48, fontWeight: '900',
            fontFamily: '-apple-system, sans-serif',
            fillStyle: '#ffe3e3', shadowColor: 'rgba(0,0,0,0.9)',
            shadowBlur: 16, letterSpacing: 4
          }, state);
        });

        // 8. Name
        const nameText = userNameInput.value.trim() ? userNameInput.value.toUpperCase() : "";
        if (nameText) {
          withAnimation(textAnimations.name, t, 1000, 800, (state) => {
            ctx.save();
            ctx.globalAlpha = state.alpha;
            const ox = state.offsetX, oy = state.offsetY;
            const sc = state.scale, rot = state.rotate, glow = state.glow;
            if (sc !== 1 || rot !== 0) {
              ctx.translate(w / 2, 670);
              ctx.rotate(rot); ctx.scale(sc, sc);
              ctx.translate(-w / 2, -670);
            }
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff0f3';
            ctx.font = '900 36px -apple-system, sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 8 + glow;
            ctx.fillText(nameText, w / 2 + ox, 670 + oy, 600);
            ctx.restore();
          });
        }

        // --- BOTTOM ALIGNMENT SETUP ---
        // Logo bottom edge is at roughly: 1865 px
        // We anchor hashtags and the random slogan pair down at the bottom matching the logo's baseline.
        const hashtagY = 1810;
        const sloganY = 1750;

        // 9. Random Slogan (shifted down above hashtags)
        withAnimation(textAnimations.rotatingSlogan, t, 1500, 900, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const sc = state.scale, rot = state.rotate, glow = state.glow;
          if (sc !== 1 || rot !== 0) {
            ctx.translate(w / 2, sloganY);
            ctx.rotate(rot); ctx.scale(sc, sc);
            ctx.translate(-w / 2, -sloganY);
          }
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 40px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 14 + glow;

          if (textAnimations.rotatingSlogan === 'wave' || textAnimations.rotatingSlogan === 'pulse') {
            const fullText = currentRotatingSlogan;
            const totalW = ctx.measureText(fullText).width;
            let startX = w / 2 - totalW / 2 + ox;
            const py = sloganY + oy;
            for (let i = 0; i < fullText.length; i++) {
              const ch = fullText[i];
              const chW = ctx.measureText(ch).width;
              const waveY = Math.sin((t / 200) + i * 0.5) * 8;
              ctx.fillText(ch, startX, py + waveY);
              startX += chW;
            }
          } else {
            wrapText(ctx, currentRotatingSlogan, w / 2 + ox, sloganY + oy, 900, 48);
          }
          ctx.restore();
        });

        // 10. Hashtags (anchored to match logo bottom level)
        withAnimation(textAnimations.hashtags, t, 2000, 800, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const sc = state.scale, rot = state.rotate, glow = state.glow;
          if (sc !== 1 || rot !== 0) {
            ctx.translate(w / 2, hashtagY);
            ctx.rotate(rot); ctx.scale(sc, sc);
            ctx.translate(-w / 2, -hashtagY);
          }
          ctx.fillStyle = '#ffe3e3';
          ctx.font = '900 30px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 10 + glow;
          ctx.fillText('#DontMissABeat    #UseHeart', w / 2 + ox, hashtagY + oy);
          ctx.restore();
        });

        // 11. Hospital Logo at Bottom Left with white blending pill
        if (hospitalLogo.complete && hospitalLogo.naturalHeight !== 0) {
          const targetLogoHeight = 65;
          const logoWidth = (hospitalLogo.width / hospitalLogo.height) * targetLogoHeight;
          const paddingX = 14;
          const paddingY = 10;
          const pillWidth = logoWidth + (paddingX * 2);
          const pillHeight = targetLogoHeight + (paddingY * 2);
          const logoX = 45;
          const logoY = 1865 - targetLogoHeight - paddingY;

          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
          ctx.shadowColor = 'rgba(0,0,0,0.3)';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.roundRect(logoX, logoY, pillWidth, pillHeight, 14);
          ctx.fill();

          ctx.drawImage(hospitalLogo, logoX + paddingX, logoY + paddingY, logoWidth, targetLogoHeight);
          ctx.restore();
        }

        // Hidden credit comment: Developed by Ahmed Shareef for Shaviyani Atoll Hospital
      }

      // ============ ECG ============
      function drawContinuousNormalEcg(elapsedTime) {
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(255,255,255,0.95)';
        ctx.shadowBlur = 14;
        ctx.beginPath();

        const ecgY = 1360; // Cleanly separates bottom of vertical oval and upper slogans
        const totalDuration = 10000;
        const progress = (currentMode === 'video') ? Math.min(1, elapsedTime / totalDuration) : 1.0;
        const maxVisibleX = canvas.width * progress;

        function getEcgOffset(t) {
          const cycleTime = 750;
          const localT = t % cycleTime;
          let val = 0;
          if (localT > 100 && localT < 220) {
            val -= 12 * Math.sin(((localT - 100) / 120) * Math.PI);
          } else if (localT >= 260 && localT < 290) {
            val += 18;
          } else if (localT >= 290 && localT < 340) {
            val -= 195 * Math.sin(((localT - 290) / 50) * Math.PI);
          } else if (localT >= 340 && localT < 380) {
            val += 45 * Math.sin(((localT - 340) / 40) * Math.PI);
          } else if (localT >= 460 && localT < 640) {
            val -= 28 * Math.sin(((localT - 460) / 180) * Math.PI);
          }
          return val;
        }

        let started = false;
        const timeShift = (currentMode === 'video') ? elapsedTime : (performance.now() * 0.4);
        const endX = (currentMode === 'video') ? maxVisibleX : canvas.width;

        for (let x = 0; x <= endX; x += 4) {
          const t = x * 2.2 + timeShift;
          const y = ecgY + getEcgOffset(t);
          if (!started) { ctx.moveTo(x, y); started = true; }
          else { ctx.lineTo(x, y); }
        }
        ctx.stroke();
        ctx.restore();
      }

      // ============ TEXT WRAP ============
      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          if (context.measureText(testLine).width > maxWidth && n > 0) {
            context.fillText(line, x, currentY);
            line = words[n] + ' ';
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, currentY);
      }

      // ============ FILE HANDLING ============
      function handleMediaSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        photoOffsetX = 0;
        photoOffsetY = 0;
        zoomRange.value = 1;
        photoScale = 1;
        zoomValue.textContent = '1.0×';

        if (file.type.startsWith('video/')) {
          if (userVideo) { userVideo.pause(); userVideo.src = ''; }
          userVideo = document.createElement('video');
          userVideo.src = URL.createObjectURL(file);
          userVideo.loop = true;
          userVideo.muted = false;
          userVideo.playsInline = true;
          userVideo.setAttribute('playsinline', '');
          userVideo.setAttribute('webkit-playsinline', '');
          userVideo.crossOrigin = 'anonymous';
          userVideo.volume = 1.0;
          userVideo.play().catch(() => {});
          userVideo.onloadeddata = () => scheduleDraw();
          userImage = null;
        } else {
          if (userVideo) { userVideo.pause(); userVideo.src = ''; userVideo = null; }
          const reader = new FileReader();
          reader.onload = (ev) => {
            userImage = new Image();
            userImage.src = ev.target.result;
            userImage.onload = () => scheduleDraw();
          };
          reader.readAsDataURL(file);
        }
        setTimeout(() => {
          cameraInput.value = '';
          galleryInput.value = '';
        }, 500);
      }

      cameraInput.addEventListener('change', handleMediaSelect);
      galleryInput.addEventListener('change', handleMediaSelect);

      // ============ CAMERA & GALLERY BUTTONS ============
      cameraBtn.addEventListener('click', () => {
        cameraInput.click();
      });

      galleryBtn.addEventListener('click', () => {
        galleryInput.click();
      });

      // ============ TOUCH DRAG ============
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - photoOffsetX;
          startY = e.touches[0].clientY - photoOffsetY;
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          photoOffsetX = e.touches[0].clientX - startX;
          photoOffsetY = e.touches[0].clientY - startY;
          if (currentMode === 'image') scheduleDraw();
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        isDragging = false;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchcancel', () => { isDragging = false; });

      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - photoOffsetX;
        startY = e.clientY - photoOffsetY;
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        photoOffsetX = e.clientX - startX;
        photoOffsetY = e.clientY - startY;
        if (currentMode === 'image') scheduleDraw();
      });
      window.addEventListener('mouseup', () => { isDragging = false; });

      // ============ UI LISTENERS ============
      zoomRange.addEventListener('input', (e) => {
        photoScale = parseFloat(e.target.value);
        zoomValue.textContent = photoScale.toFixed(1) + '×';
        if (currentMode === 'image') scheduleDraw();
      });

      userNameInput.addEventListener('input', () => {
        if (currentMode === 'image') scheduleDraw();
      });

      shuffleBtn.addEventListener('click', () => {
        const currentIndex = rotatingHeartbeatSlogans.indexOf(currentRotatingSlogan);
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * rotatingHeartbeatSlogans.length);
        } while (nextIndex === currentIndex && rotatingHeartbeatSlogans.length > 1);
        currentRotatingSlogan = rotatingHeartbeatSlogans[nextIndex];
        randomizeMascot();
        if (currentMode === 'image') scheduleDraw();
      });

      // ============ MODE SWITCH ============
      window.switchMode = function(mode) {
        currentMode = mode;
        if (animationId) cancelAnimationFrame(animationId);
        lastRecordedVideoBlob = null;

        modeImageBtn.classList.toggle('active', mode === 'image');
        modeVideoBtn.classList.toggle('active', mode === 'video');

        if (mode === 'image') {
          videoStatus.classList.remove('visible');
          actionDownloadBtn.textContent = '💾 Save Story';
          actionShareBtn.textContent = '📤 Share Story';
          cameraBtnText.textContent = 'Take Photo';
          galleryBtnText.textContent = 'Choose Photo';
          mediaTypeBadge.textContent = 'Photo';
          cameraInput.setAttribute('accept', 'image/*');
          cameraInput.setAttribute('capture', 'environment');
          galleryInput.setAttribute('accept', 'image/*');
          if (userVideo) { userVideo.pause(); userVideo = null; }
          scheduleDraw();
        } else {
          randomizeTextAnimations();
          videoStatus.classList.add('visible');
          videoStatus.textContent = '🎥 10s Story Video · Animated text · Original audio preserved';
          actionDownloadBtn.textContent = '📥 Export MP4';
          actionShareBtn.textContent = '📤 Share MP4';
          cameraBtnText.textContent = 'Record Video';
          galleryBtnText.textContent = 'Choose Video';
          mediaTypeBadge.textContent = 'Video';
          cameraInput.setAttribute('accept', 'video/*');
          cameraInput.setAttribute('capture', 'environment');
          galleryInput.setAttribute('accept', 'video/*');
          userImage = null;
          recordingStartTime = performance.now();
          startVideoPreviewLoop();
        }
        cameraInput.value = '';
        galleryInput.value = '';
      };

      // ============ VIDEO PREVIEW ============
      function startVideoPreviewLoop() {
        function loop(timestamp) {
          if (currentMode !== 'video') return;
          const elapsed = timestamp - recordingStartTime;
          drawCanvas(elapsed);
          if (elapsed < 10000) {
            animationId = requestAnimationFrame(loop);
          } else {
            videoStatus.textContent = '✅ 10s preview finished — tap Export MP4';
          }
        }
        animationId = requestAnimationFrame(loop);
      }

      // ============ DOWNLOAD ============
      actionDownloadBtn.addEventListener('click', async () => {
        if (currentMode === 'image') {
          const link = document.createElement('a');
          link.download = 'world-heart-day-2026-story.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else {
          if (!window.MediaRecorder) {
            alert('Video recording is not supported on this browser.');
            return;
          }
          if (lastRecordedVideoBlob) {
            downloadVideoBlob(lastRecordedVideoBlob);
            return;
          }

          randomizeTextAnimations();

          videoStatus.classList.add('visible');
          videoStatus.textContent = '🎥 Recording 10s vertical video... Please wait.';

          recordingStartTime = performance.now();
          const canvasStream = canvas.captureStream(30);

          try {
            let combinedStream;
            let audioCtx = null;

            if (userVideo && userVideo.srcObject instanceof MediaStream) {
              combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...userVideo.srcObject.getAudioTracks()
              ]);
            } else if (userVideo) {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const source = audioCtx.createMediaElementSource(userVideo);
              const dest = audioCtx.createMediaStreamDestination();
              source.connect(dest);
              source.connect(audioCtx.destination);
              combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
              ]);
            } else {
              combinedStream = new MediaStream([...canvasStream.getVideoTracks()]);
            }

            let mime = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
            if (!MediaRecorder.isTypeSupported(mime)) {
              mime = 'video/mp4';
              if (!MediaRecorder.isTypeSupported(mime)) {
                mime = 'video/webm;codecs=h264,opus';
              }
            }

            const recorder = new MediaRecorder(combinedStream, { mimeType: mime });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
              if (audioCtx) audioCtx.close().catch(() => {});
              lastRecordedVideoBlob = new Blob(chunks, { type: 'video/mp4' });
              downloadVideoBlob(lastRecordedVideoBlob);
              videoStatus.textContent = '✅ 10s story video saved successfully!';
            };

            recorder.start();
            startVideoPreviewLoop();

            setTimeout(() => {
              if (recorder.state !== 'inactive') recorder.stop();
            }, 10000);

          } catch (err) {
            console.error(err);
            alert('Video export error: ' + err.message + '\n\nNote: Audio capture works best when a video with sound is uploaded.');
            videoStatus.classList.remove('visible');
          }
        }
      });

      function downloadVideoBlob(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'world-heart-day-2026-story.mp4';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      // ============ SHARE ============
      actionShareBtn.addEventListener('click', async () => {
        if (currentMode === 'image') {
          const dataUrl = canvas.toDataURL('image/png');
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], 'world-heart-day-2026-story.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'World Heart Day 2026 Story',
                text: `${bannerSloganText} — ${currentRotatingSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                files: [file]
              });
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('Share failed', err);
            }
          } else {
            alert('Direct sharing is not supported here. Please use "Save Story" instead.');
          }
        } else {
          if (!lastRecordedVideoBlob) {
            alert('Please click "Export MP4" first to record the 10s clip before sharing.');
            return;
          }
          const videoFile = new File([lastRecordedVideoBlob], 'world-heart-day-2026-story.mp4', { type: 'video/mp4' });

          if (navigator.canShare && navigator.canShare({ files: [videoFile] })) {
            try {
              await navigator.share({
                title: 'World Heart Day 2026 Story Video',
                text: `${bannerSloganText} — ${currentRotatingSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                files: [videoFile]
              });
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('Share failed', err);
            }
          } else {
            alert('Direct video sharing is not supported. Your MP4 was saved to downloads.');
          }
        }
      });

      // ============ PREVENT SCROLL BOUNCE ON CANVAS ============
      document.getElementById('canvasFrame').addEventListener('touchmove', (e) => {
        if (e.target === canvas) e.preventDefault();
      }, { passive: false });

      // ============ PREVENT DOUBLE-TAP ZOOM ============
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      // ============ INIT ============
      randomizeMascot();
      randomizeTextAnimations();
      scheduleDraw();

      window.addEventListener('load', () => {
        if (currentMode === 'image') scheduleDraw();
      });

      // ============ VISIBILITY CHANGE ============
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (userVideo) userVideo.pause();
          if (animationId) cancelAnimationFrame(animationId);
        } else {
          if (userVideo && currentMode === 'image') userVideo.play().catch(() => {});
          if (currentMode === 'image') scheduleDraw();
        }
      });

    })();
  </script>
</body>
</html>
