<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Heart Day 2026 - Creator & Video Generator</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WHD Generator">

    <style>
        :root {
            --primary-red: #d90429;
            --dark-red: #8d0801;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #212529;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .creator-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(217, 4, 41, 0.12);
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            margin: 0 0 4px 0;
            color: var(--primary-red);
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #6c757d;
            margin-bottom: 10px;
            font-weight: 500;
        }

        /* Mode Switcher Tabs */
        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
            background: #e9ecef;
            padding: 4px;
            border-radius: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #495057;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary-red);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f1f3f5;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label.field-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #495057;
            margin-left: 2px;
        }

        .file-upload-btn {
            background: #ffe3e3;
            border: 2px dashed var(--primary-red);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary-red);
            text-align: center;
            transition: background 0.2s;
            display: block;
        }

        .file-upload-btn:active {
            background: #ffc9c9;
        }

        input[type="file"] {
            display: none;
        }

        input[type="text"], input[type="range"] {
            width: 100%;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            box-sizing: border-box;
            font-size: 0.85rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-red);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-shuffle {
            background: #495057;
            color: white;
            grid-column: span 2;
        }

        .btn-download {
            background: #212529;
            color: white;
        }

        .btn-share {
            background: var(--primary-red);
            color: white;
        }

        #videoStatus {
            font-size: 0.75rem;
            color: var(--primary-red);
            font-weight: bold;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="creator-container">
        <h2>WORLD HEART DAY 2026</h2>
        <p class="subtitle">#DontMissABeat #UseHeart</p>
        
        <!-- Mode Switcher -->
        <div class="mode-tabs">
            <button class="tab-btn active" id="modeImageBtn" onclick="switchMode('image')">📷 Photo Poster Mode</button>
            <button class="tab-btn" id="modeVideoBtn" onclick="switchMode('video')">🎥 10s Video Clip Mode</button>
        </div>

        <!-- Live Preview Canvas -->
        <div class="canvas-wrapper">
            <canvas id="creatorCanvas" width="1000" height="1000"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">
            <!-- Mobile Camera & Gallery Trigger -->
            <label class="file-upload-btn">
                📸 Take Selfie / Choose from Gallery
                <input type="file" id="imageUpload" accept="image/*">
            </label>

            <label class="field-label" for="zoomRange">Adjust Photo Zoom</label>
            <input type="range" id="zoomRange" min="0.5" max="2.5" step="0.05" value="1">

            <label class="field-label" for="userName">Your Name or Team (Optional)</label>
            <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28">

            <button class="btn btn-shuffle" id="shuffleBtn">🔄 Shuffle Official Theme</button>
            
            <div id="videoStatus">Recording 10s Video Clip... Please wait.</div>

            <div class="btn-group">
                <button class="btn btn-download" id="actionDownloadBtn">💾 Save Image</button>
                <button class="btn btn-share" id="actionShareBtn">📤 Share Card</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('creatorCanvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const zoomRange = document.getElementById('zoomRange');
        const userNameInput = document.getElementById('userName');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const actionDownloadBtn = document.getElementById('actionDownloadBtn');
        const actionShareBtn = document.getElementById('actionShareBtn');
        const videoStatus = document.getElementById('videoStatus');

        let userImage = null;
        let photoScale = 1;
        let currentMode = 'image'; // 'image' or 'video'
        let animationId = null;
        let pulsePhase = 0;

        // Load Hospital Logo
        const hospitalLogo = new Image();
        hospitalLogo.src = 'shah_logo.png';
        hospitalLogo.onload = () => { if (currentMode === 'image') drawStaticCanvas(); };

        // Official World Heart Day Themes & Slogans
        const campaignThemes = [
            "DON'T MISS A BEAT",
            "USE HEART FOR ACTION",
            "SEE THE SIGNS, PROTECT YOUR HEART",
            "LOVE YOUR HEART BEFORE IT HURT",
            "KEEP THE BEAT: ACT EARLY"
        ];
        let currentSlogan = campaignThemes[0];

        // Handle Photo Upload / Gallery Selection
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImage = new Image();
                    userImage.src = event.target.result;
                    userImage.onload = () => {
                        if (currentMode === 'image') drawStaticCanvas();
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        zoomRange.addEventListener('input', (e) => {
            photoScale = parseFloat(e.target.value);
            if (currentMode === 'image') drawStaticCanvas();
        });

        userNameInput.addEventListener('input', () => {
            if (currentMode === 'image') drawStaticCanvas();
        });

        shuffleBtn.addEventListener('click', () => {
            const currentIndex = campaignThemes.indexOf(currentSlogan);
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * campaignThemes.length);
            } while (nextIndex === currentIndex);
            currentSlogan = campaignThemes[nextIndex];
            if (currentMode === 'image') drawStaticCanvas();
        });

        // Mode Switcher Logic
        function switchMode(mode) {
            currentMode = mode;
            if (animationId) cancelAnimationFrame(animationId);

            document.getElementById('modeImageBtn').classList.toggle('active', mode === 'image');
            document.getElementById('modeVideoBtn').classList.toggle('active', mode === 'video');

            if (mode === 'image') {
                videoStatus.style.display = 'none';
                actionDownloadBtn.textContent = '💾 Save Image';
                actionShareBtn.textContent = '📤 Share Card';
                drawStaticCanvas();
            } else {
                videoStatus.style.display = 'block';
                videoStatus.textContent = '🎥 Video Mode Active (Animated Pulse & Audio Tone)';
                actionDownloadBtn.textContent = '📥 Export 10s Video';
                actionShareBtn.textContent = '📤 Share Video';
                startVideoPreviewLoop();
            }
        }

        // --- Core Rendering for Static Image ---
        function drawStaticCanvas(pulse = 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Red Background
            ctx.fillStyle = '#d90429';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. ECG Heartbeat Line with optional pulse scaling
            drawEcgLine(pulse);

            // 3. Hospital Logo
            if (hospitalLogo.complete && hospitalLogo.naturalHeight !== 0) {
                const logoHeight = 60;
                const logoWidth = (hospitalLogo.width / hospitalLogo.height) * logoHeight;
                ctx.drawImage(hospitalLogo, 50, 40, logoWidth, logoHeight);
            }

            // 4. Header Title
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('WORLD HEART DAY', canvas.width / 2, 120);
            ctx.font = '900 34px sans-serif';
            ctx.fillText('2026', canvas.width / 2, 170);

            // 5. Left-Aligned Circle Photo Frame
            const circleRadius = 210 + (pulse > 0 ? pulse * 4 : 0); // subtle heartbeat scale effect
            const circleX = circleRadius + 40;
            const circleY = 560;

            ctx.save();
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
            ctx.clip();

            if (userImage) {
                const baseSize = (circleRadius * 2) * photoScale;
                const x = circleX - (baseSize / 2);
                const y = circleY - (baseSize / 2);
                ctx.drawImage(userImage, x, y, baseSize, baseSize);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.fillStyle = '#d90429';
                ctx.font = 'bold 26px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Tap below', circleX, circleY - 10);
                ctx.fillText('to take selfie', circleX, circleY + 25);
            }
            ctx.restore();

            // Circle Border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
            ctx.stroke();

            // 6. Theme Slogan & Name
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            wrapText(ctx, currentSlogan, 700, 420, 500, 42);

            const nameText = userNameInput.value.trim() ? userNameInput.value.toUpperCase() : "#DontMissABeat #UseHeart";
            ctx.fillStyle = '#ffe3e3';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText(nameText, 700, 740, 520);
        }

        // Draw ECG Line Helper
        function drawEcgLine(pulse = 0) {
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            const ecgY = 560;
            ctx.moveTo(0, ecgY);
            ctx.lineTo(100, ecgY);
            ctx.lineTo(120, ecgY - 15);
            ctx.lineTo(140, ecgY);
            ctx.lineTo(155, ecgY + 25);
            ctx.lineTo(180, ecgY - (220 + pulse * 20)); // Dynamic pulse spike
            ctx.lineTo(205, ecgY + 70);
            ctx.lineTo(230, ecgY);
            ctx.lineTo(265, ecgY - 50);
            ctx.lineTo(300, ecgY);
            
            ctx.lineTo(450, ecgY);
            ctx.lineTo(470, ecgY - 15);
            ctx.lineTo(490, ecgY);
            ctx.lineTo(505, ecgY + 25);
            ctx.lineTo(530, ecgY - (220 + pulse * 20));
            ctx.lineTo(555, ecgY + 70);
            ctx.lineTo(580, ecgY);
            ctx.lineTo(615, ecgY - 50);
            ctx.lineTo(750, ecgY);
            ctx.lineTo(1000, ecgY);
            ctx.stroke();
        }

        // --- Video Preview & Animation Loop ---
        function startVideoPreviewLoop() {
            function loop(timestamp) {
                if (currentMode !== 'video') return;
                pulsePhase = Math.sin(timestamp / 200) > 0.8 ? 1 : 0; // Heartbeat trigger pulse
                drawStaticCanvas(pulsePhase);
                animationId = requestAnimationFrame(loop);
            }
            animationId = requestAnimationFrame(loop);
        }

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;
            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
        }

        // --- Export & Share Handlers ---
        actionDownloadBtn.addEventListener('click', async () => {
            if (currentMode === 'image') {
                const link = document.createElement('a');
                link.download = 'world-heart-day-2026.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            } else {
                // Video Recording Mode using MediaRecorder (10 seconds)
                if (!window.MediaRecorder) {
                    alert("Video recording is not supported on this browser.");
                    return;
                }

                videoStatus.style.display = 'block';
                videoStatus.textContent = '🎥 Recording 10s video clip with audio simulation... Please wait.';
                
                const stream = canvas.captureStream(30); // 30 FPS canvas stream
                
                // Add synthetic heartbeat audio tone using Web Audio API
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const dest = audioCtx.createMediaStreamDestination();
                    
                    // Periodic soft heartbeat beep simulation
                    const interval = setInterval(() => {
                        if (audioCtx.state === 'suspended') audioCtx.resume();
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(120, audioCtx.currentTime); // low thump tone
                        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                        osc.connect(gain);
                        gain.connect(dest);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.15);
                    }, 800);

                    // Combine video stream and audio destination
                    const combinedStream = new MediaStream([
                        ...stream.getVideoTracks(),
                        ...dest.stream.getAudioTracks()
                    ]);

                    const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
                    let chunks = [];

                    recorder.ondataavailable = e => chunks.push(e.data);
                    recorder.onstop = () => {
                        clearInterval(interval);
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'world-heart-day-2026.webm';
                        a.click();
                        videoStatus.textContent = '✅ 10s Video Clip saved successfully!';
                    };

                    recorder.start();
                    setTimeout(() => {
                        recorder.stop();
                    }, 10000); // exactly 10 seconds

                } catch (err) {
                    console.error(err);
                    alert("Video export error: " + err.message);
                    videoStatus.style.display = 'none';
                }
            }
        });

        actionShareBtn.addEventListener('click', async () => {
            const dataUrl = canvas.toDataURL('image/png');
            const blob = await (await fetch(dataUrl)).blob();
            const file = new File([blob], 'world-heart-day-2026.png', { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    title: 'World Heart Day 2026',
                    text: `${currentSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                    files: [file]
                });
            } else {
                alert("Direct sharing is restricted in this browser view. Please use 'Save Image' instead!");
            }
        });

        // Initial paint
        drawStaticCanvas();
    </script>
</body>
</html>
