<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Heart Day 2026 - Creator</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WHD Creator">

    <style>
        :root {
            --primary-red: #d90429;
            --dark-red: #8d0801;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #212529;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .creator-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(217, 4, 41, 0.12);
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            margin: 0 0 4px 0;
            color: var(--primary-red);
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #6c757d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f1f3f5;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label.field-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #495057;
            margin-left: 2px;
        }

        .file-upload-btn {
            background: #ffe3e3;
            border: 2px dashed var(--primary-red);
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-red);
            text-align: center;
            transition: background 0.2s;
            display: block;
        }

        .file-upload-btn:active {
            background: #ffc9c9;
        }

        input[type="file"] {
            display: none;
        }

        input[type="text"], input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            box-sizing: border-box;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-red);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-shuffle {
            background: #495057;
            color: white;
            grid-column: span 2;
        }

        .btn-download {
            background: #212529;
            color: white;
        }

        .btn-share {
            background: var(--primary-red);
            color: white;
        }
    </style>
</head>
<body>

    <div class="creator-container">
        <h2>WORLD HEART DAY 2026</h2>
        <p class="subtitle">#DontMissABeat #UseHeart</p>
        
        <!-- Live Preview Canvas -->
        <div class="canvas-wrapper">
            <canvas id="creatorCanvas" width="1000" height="1000"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">
            <label class="file-upload-btn">
                📸 Take Selfie or Choose Photo
                <input type="file" id="imageUpload" accept="image/*" capture="user">
            </label>

            <label class="field-label" for="zoomRange">Adjust Photo Zoom</label>
            <input type="range" id="zoomRange" min="0.5" max="2.5" step="0.05" value="1">

            <label class="field-label" for="userName">Your Name or Team (Optional)</label>
            <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28">

            <button class="btn btn-shuffle" id="shuffleBtn">🔄 Shuffle Official Theme</button>
            
            <div class="btn-group">
                <button class="btn btn-download" id="downloadBtn">💾 Save Image</button>
                <button class="btn btn-share" id="shareBtn">📤 Share Card</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('creatorCanvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const zoomRange = document.getElementById('zoomRange');
        const userNameInput = document.getElementById('userName');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');

        let userImage = null;
        let photoScale = 1;

        // Load Hospital Logo
        const hospitalLogo = new Image();
        hospitalLogo.src = 'shah_logo.png';
        hospitalLogo.onload = () => drawCanvas();

        // Official World Heart Day 2026 Themes & Slogans
        const campaignThemes = [
            "DON'T MISS A BEAT",
            "USE HEART FOR ACTION",
            "SEE THE SIGNS, PROTECT YOUR HEART",
            "LOVE YOUR HEART BEFORE IT HURT",
            "KEEP THE BEAT: ACT EARLY"
        ];
        let currentSlogan = campaignThemes[0];

        // Handle Photo Upload / Camera Capture
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImage = new Image();
                    userImage.src = event.target.result;
                    userImage.onload = () => drawCanvas();
                };
                reader.readAsDataURL(file);
            }
        });

        zoomRange.addEventListener('input', (e) => {
            photoScale = parseFloat(e.target.value);
            drawCanvas();
        });

        userNameInput.addEventListener('input', () => drawCanvas());

        shuffleBtn.addEventListener('click', () => {
            const currentIndex = campaignThemes.indexOf(currentSlogan);
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * campaignThemes.length);
            } while (nextIndex === currentIndex);
            currentSlogan = campaignThemes[nextIndex];
            drawCanvas();
        });

        // Core Canvas Renderer: Red BG, Full Healthy P-Q-R-S-T ECG, Left-Touching Circle Frame, and 2026 Branding
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Red Campaign Background
            ctx.fillStyle = '#d90429';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Full Healthy Rhythm ECG Heartbeat Line (P-Q-R-S-T Waves repeating)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            
            const ecgY = 560;
            ctx.moveTo(0, ecgY);
            // First Beat Rhythm Cycle
            ctx.lineTo(100, ecgY);
            ctx.lineTo(120, ecgY - 15); // P wave
            ctx.lineTo(140, ecgY);     // baseline
            ctx.lineTo(155, ecgY + 25); // Q dip
            ctx.lineTo(180, ecgY - 220); // R peak (tall healthy spike)
            ctx.lineTo(205, ecgY + 70); // S wave drop
            ctx.lineTo(230, ecgY);     // baseline
            ctx.lineTo(265, ecgY - 50); // T wave
            ctx.lineTo(300, ecgY);
            
            // Second Beat Rhythm Cycle
            ctx.lineTo(450, ecgY);
            ctx.lineTo(470, ecgY - 15); // P wave
            ctx.lineTo(490, ecgY);
            ctx.lineTo(505, ecgY + 25); // Q dip
            ctx.lineTo(530, ecgY - 220); // R peak
            ctx.lineTo(555, ecgY + 70); // S wave
            ctx.lineTo(580, ecgY);
            ctx.lineTo(615, ecgY - 50); // T wave
            ctx.lineTo(750, ecgY);
            ctx.lineTo(1000, ecgY);
            ctx.stroke();

            // 3. Draw Hospital Logo (Top Left Corner)
            if (hospitalLogo.complete && hospitalLogo.naturalHeight !== 0) {
                const logoHeight = 60;
                const logoWidth = (hospitalLogo.width / hospitalLogo.height) * logoHeight;
                ctx.drawImage(hospitalLogo, 50, 40, logoWidth, logoHeight);
            }

            // 4. Top Header Text: "WORLD HEART DAY 2026" in White
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('WORLD HEART DAY', canvas.width / 2, 120);
            ctx.font = '900 34px sans-serif';
            ctx.fillText('2026', canvas.width / 2, 170);

            // 5. Circular Photo Frame Configuration (Shifted Left, touching left side)
            const circleRadius = 210;
            const circleX = circleRadius + 40; // touching left margin edge
            const circleY = 560;

            // Save state for circular clipping
            ctx.save();
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
            ctx.clip();

            if (userImage) {
                const baseSize = (circleRadius * 2) * photoScale;
                const x = circleX - (baseSize / 2);
                const y = circleY - (baseSize / 2);
                ctx.drawImage(userImage, x, y, baseSize, baseSize);
            } else {
                // Placeholder background inside the circle
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.fillStyle = '#d90429';
                ctx.font = 'bold 26px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Tap below', circleX, circleY - 10);
                ctx.fillText('to take selfie', circleX, circleY + 25);
            }
            ctx.restore();

            // 6. Clean White Border Stroke around the Left Circle
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
            ctx.stroke();

            // 7. Theme Slogan & Custom Name on the Right Side / Bottom
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px sans-serif';
            ctx.textAlign = 'center';
            wrapText(ctx, currentSlogan, 700, 420, 500, 42);

            // Custom Name or Official Hashtags at Bottom Right
            const nameText = userNameInput.value.trim() ? userNameInput.value.toUpperCase() : "#DontMissABeat #UseHeart";
            ctx.fillStyle = '#ffe3e3';
            ctx.font = 'bold 24px sans-serif';
            ctx.fillText(nameText, 700, 740, 520);
        }

        // Text Wrapping Utility
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
        }

        // Download Action
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'world-heart-day-2026.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Web Share API (Android & iOS Native Share)
        shareBtn.addEventListener('click', async () => {
            try {
                const dataUrl = canvas.toDataURL('image/png');
                const blob = await (await fetch(dataUrl)).blob();
                const file = new File([blob], 'world-heart-day-2026.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'World Heart Day 2026',
                        text: `${currentSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                        files: [file]
                    });
                } else {
                    alert("Direct sharing is restricted in this browser view. Please use 'Save Image' instead!");
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Sharing failed:", err);
                }
            }
        });
    </script>
</body>
</html>
