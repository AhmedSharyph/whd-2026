<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WHD Creator">
  <meta name="theme-color" content="#d90429">
  <title>WHD 2026 · Creator Studio</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/hashtagStyles.css">
</head>
<body>

  <div class="app" id="app">
    <div class="scroll-area" id="scrollArea">

      <!-- HEADER -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark">❤️</div>
          <div class="brand-text">
            <h1>SHAH HEALTH PORTAL</h1>
            <div class="sub">World Heart Day 2026</div>
          </div>
        </div>
        <div class="live-badge">
          <span class="live-dot"></span>
          Story Studio
        </div>
      </header>

      <!-- MODE SWITCH -->
      <div class="mode-tabs" id="modeTabs">
        <button class="tab-btn active" id="modeImageBtn" type="button">📷 Photo Story</button>
        <button class="tab-btn" id="modeVideoBtn" type="button">🎥 10s Story Video</button>
      </div>

      <!-- CANVAS FRAME (3:4 Ratio) -->
      <div class="canvas-frame" id="canvasFrame">
        <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>
        <canvas id="creatorCanvas" width="1080" height="1440"></canvas>
      </div>

      <!-- UPLOAD -->
      <div class="upload-section">
        <div class="upload-label-row">
          <span class="label-text">Add your media</span>
          <span class="media-type-badge" id="mediaTypeBadge">Photo</span>
        </div>
        <div class="upload-actions">
          <button class="upload-action-btn" id="cameraBtn" type="button">
            <span class="icon-circle">📸</span>
            <span id="cameraBtnText">Take Photo</span>
          </button>
          <button class="upload-action-btn" id="galleryBtn" type="button">
            <span class="icon-circle">🖼️</span>
            <span id="galleryBtnText">Choose Photo</span>
          </button>
        </div>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
        <input type="file" id="galleryInput" accept="image/*" style="display:none;">
      </div>

      <!-- SHUFFLE -->
      <button class="btn btn-shuffle" id="shuffleSloganBtn" type="button">🔀 Shuffle Message Slogan</button>

      <!-- ZOOM & FLOW HASHTAG CONTAINER -->
      <div class="field-group">
        <div class="field-label">
          <span>Hashtags & Flow Layout</span>
        </div>
        <div id="hashtag-container"></div>
      </div>

      <!-- ZOOM -->
      <div class="field-group">
        <div class="field-label">
          <span>Zoom & drag inside media area</span>
          <span class="value-badge" id="zoomValue">1.0×</span>
        </div>
        <div class="range-wrapper">
          <input type="range" id="zoomRange" min="0.5" max="3.0" step="0.05" value="1">
        </div>
      </div>

      <!-- NAME -->
      <div class="field-group">
        <label class="field-label" for="userName">
          <span>Your name / team (optional)</span>
        </label>
        <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
      </div>

      <!-- VIDEO STATUS -->
      <div class="video-status" id="videoStatus"></div>

      <!-- ACTIONS -->
      <div class="btn-group">
        <button class="btn btn-download" id="actionDownloadBtn">💾 Save Story</button>
        <button class="btn btn-share" id="actionShareBtn">📤 Share Story</button>
      </div>

      <!-- FOOTER -->
      <div class="app-footer">Developed by Ahmed Shareef · Shaviyani Atoll Hospital</div>

    </div>
  </div>

  <!-- Main JavaScript Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
