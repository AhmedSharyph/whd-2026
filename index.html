<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WHD Creator">
  <meta name="theme-color" content="#7a0010">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="screen-orientation" content="portrait">
  <meta name="x5-orientation" content="portrait">
  <title>WHD 2026 · Mobile Studio</title>
  <style>
    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      touch-action: manipulation;
      background: #fafafa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100%;
      width: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      padding: 0;
      margin: 0;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: #fafafa;
    }

    /* ===== APP SHELL ===== */
    .app {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #fafafa;
      z-index: 1;
    }

    /* ===== SCROLL AREA ===== */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      overscroll-behavior: contain;
      background: #fafafa;
    }

    /* ===== HEADER ===== */
    .app-header {
      text-align: center;
      padding: 4px 0 2px;
      flex-shrink: 0;
    }

    .app-header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #7a0010;
      line-height: 1.2;
    }

    .app-header .sub {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #9a5a5a;
      margin-top: 2px;
    }

    /* ===== MODE TABS ===== */
    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: rgba(0, 0, 0, 0.05);
      padding: 4px;
      border-radius: 14px;
      flex-shrink: 0;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 12px 4px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #6a4040;
      border-radius: 11px;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(0.2, 0.9, 0.4, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #b3001b;
      box-shadow: 0 4px 12px rgba(180, 20, 40, 0.18);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    /* ===== CANVAS FRAME ===== */
    .canvas-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      overflow: hidden;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 14px 34px rgba(120, 0, 20, 0.22),
        0 0 0 1px rgba(255, 255, 255, 0.3) inset,
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      padding: 8px;
      box-sizing: border-box;
    }

    .canvas-frame .hearts-layer {
      position: absolute;
      inset: 8px;
      border-radius: 16px;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .canvas-frame .hearts-layer .heart {
      position: absolute;
      top: -30px;
      font-size: 14px;
      opacity: 0;
      animation: heartFall linear infinite;
      will-change: transform, opacity;
      filter: drop-shadow(0 0 3px rgba(255, 100, 120, 0.55));
    }

    @keyframes heartFall {
      0% {
        transform: translateY(-30px) translateX(0) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      12% {
        opacity: 0.9;
      }
      50% {
        opacity: 0.7;
      }
      88% {
        opacity: 0.35;
      }
      100% {
        transform: translateY(110%) translateX(var(--drift, 24px)) rotate(340deg) scale(1);
        opacity: 0;
      }
    }

    .canvas-frame canvas {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 16px;
      touch-action: none;
    }

    /* ===== UPLOAD BUTTON ===== */
    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #fff5f6, #ffe4e7);
      border: 2px dashed #c81e1e;
      padding: 16px 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.82rem;
      color: #990011;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 10px rgba(200, 30, 30, 0.06);
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      flex-shrink: 0;
    }

    .upload-btn:active {
      transform: scale(0.98);
      background: #ffd6db;
    }

    .upload-btn input[type="file"] {
      display: none;
    }

    /* ===== FIELD GROUPS ===== */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .field-label {
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #5e3e3e;
      margin-left: 4px;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ===== RANGE SLIDER ===== */
    .range-wrapper {
      width: 100%;
      padding: 0 2px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: #e8d0d0;
      border-radius: 6px;
      outline: none;
      margin: 8px 0 4px;
      touch-action: manipulation;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #c81e1e;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(200, 30, 30, 0.4);
      border: 3px solid #fff;
      transition: transform 0.1s;
      touch-action: manipulation;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #c81e1e;
      cursor: pointer;
      border: 3px solid #fff;
      box-shadow: 0 3px 10px rgba(200, 30, 30, 0.4);
    }

    /* ===== TEXT INPUT ===== */
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      background: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      color: #1a1a1a;
    }

    input[type="text"]:focus {
      border-color: #c81e1e;
      box-shadow: 0 0 0 3px rgba(200, 30, 30, 0.1);
    }

    input[type="text"]::placeholder {
      color: #b09090;
      font-weight: 400;
    }

    /* ===== BUTTONS ===== */
    .btn {
      width: 100%;
      padding: 16px 12px;
      border-radius: 16px;
      border: none;
      font-weight: 700;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      color: #fff;
      flex-shrink: 0;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .btn-shuffle {
      background: #23232e;
      font-size: 0.86rem;
    }

    .btn-download {
      background: #111;
    }

    .btn-share {
      background: linear-gradient(135deg, #d90429, #7a0010);
    }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ===== VIDEO STATUS ===== */
    .video-status {
      font-size: 0.72rem;
      font-weight: 600;
      color: #990011;
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px;
      border-radius: 12px;
      display: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(200, 30, 30, 0.18);
      flex-shrink: 0;
      line-height: 1.4;
    }

    .video-status.visible {
      display: block;
    }

    /* ===== FOOTER ===== */
    .app-footer {
      text-align: center;
      font-size: 0.58rem;
      color: #b09090;
      font-weight: 500;
      padding: 6px 0 2px;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    /* ===== SAFE AREA ===== */
    @supports (padding: env(safe-area-inset-bottom)) {
      .scroll-area {
        padding-bottom: calc(28px + env(safe-area-inset-bottom));
        padding-top: calc(16px + env(safe-area-inset-top));
      }
      .app-footer {
        padding-bottom: calc(4px + env(safe-area-inset-bottom));
      }
    }

    /* ===== SMALL PHONES ===== */
    @media (max-height: 700px) {
      .scroll-area {
        gap: 10px;
        padding: 10px 12px 20px;
      }
      .app-header h1 {
        font-size: 1rem;
      }
      .canvas-frame {
        border-radius: 18px;
        padding: 6px;
      }
      .canvas-frame .hearts-layer {
        inset: 6px;
        border-radius: 13px;
      }
      .canvas-frame canvas {
        border-radius: 13px;
      }
      .upload-btn {
        padding: 13px 12px;
        font-size: 0.78rem;
      }
      .btn {
        padding: 13px 10px;
        font-size: 0.8rem;
      }
      input[type="text"] {
        padding: 12px 14px;
        font-size: 0.85rem;
      }
      .tab-btn {
        padding: 10px 4px;
        font-size: 0.72rem;
      }
    }

    /* ===== TEXT SELECTION ===== */
    .app, .app * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input[type="text"] {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    body {
      overscroll-behavior-y: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .scroll-area > * {
      animation: fadeIn 0.3s ease both;
    }
  </style>
</head>
<body>

  <div class="app" id="app">
    <div class="scroll-area" id="scrollArea">

      <!-- HEADER -->
      <header class="app-header">
        <h1>SHAH HEALTH PORTAL</h1>
        <div class="sub">World Heart Day 2026 · Mobile Studio</div>
      </header>

      <!-- MODE SWITCH -->
      <div class="mode-tabs" id="modeTabs">
        <button class="tab-btn active" id="modeImageBtn" onclick="switchMode('image')" aria-label="Photo poster mode">
          📷 Photo
        </button>
        <button class="tab-btn" id="modeVideoBtn" onclick="switchMode('video')" aria-label="10 second video mode">
          🎥 10s Video
        </button>
      </div>

      <!-- CANVAS FRAME -->
      <div class="canvas-frame" id="canvasFrame">
        <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>
        <canvas id="creatorCanvas" width="1000" height="1000"></canvas>
      </div>

      <!-- UPLOAD -->
      <label class="upload-btn" id="uploadLabelBtn" for="mediaUpload">
        <span id="uploadBtnText">📸 Shoot / Select Photo</span>
        <input type="file" id="mediaUpload" accept="image/*" capture="environment">
      </label>

      <!-- ZOOM -->
      <div class="field-group">
        <div class="field-label">Zoom & drag inside circle</div>
        <div class="range-wrapper">
          <input type="range" id="zoomRange" min="0.5" max="3.0" step="0.05" value="1">
        </div>
      </div>

      <!-- NAME -->
      <div class="field-group">
        <label class="field-label" for="userName">Your name / team (optional)</label>
        <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
      </div>

      <!-- SHUFFLE -->
      <button class="btn btn-shuffle" id="shuffleBtn">🔄 Shuffle Slogan & Mascot</button>

      <!-- VIDEO STATUS -->
      <div class="video-status" id="videoStatus"></div>

      <!-- ACTION BUTTONS -->
      <div class="btn-group">
        <button class="btn btn-download" id="actionDownloadBtn">💾 Save Image</button>
        <button class="btn btn-share" id="actionShareBtn">📤 Share Card</button>
      </div>

      <!-- FOOTER -->
      <div class="app-footer">Developed by Ahmed Shareef · Shaviyani Atoll Hospital</div>

    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ===== HEART CASCADE =====
      (function generateHearts() {
        const layer = document.getElementById('heartsLayer');
        const heartChars = ['❤', '♥', '❤️', '💗', '💓'];
        const colors = [
          'rgba(255, 180, 190, 0.9)',
          'rgba(255, 140, 160, 0.85)',
          'rgba(255, 200, 210, 0.8)',
          'rgba(255, 120, 150, 0.75)',
          'rgba(255, 220, 225, 0.7)'
        ];
        const count = 18;

        for (let i = 0; i < count; i++) {
          const heart = document.createElement('span');
          heart.className = 'heart';
          heart.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
          const size = 8 + Math.random() * 14;
          const duration = 8 + Math.random() * 12;
          const delay = Math.random() * 12;
          const left = Math.random() * 100;
          const drift = (Math.random() * 60 - 30).toFixed(0) + 'px';
          const color = colors[Math.floor(Math.random() * colors.length)];

          heart.style.left = left + '%';
          heart.style.fontSize = size + 'px';
          heart.style.color = color;
          heart.style.animationDuration = duration + 's';
          heart.style.animationDelay = '-' + delay + 's';
          heart.style.setProperty('--drift', drift);
          layer.appendChild(heart);
        }
      })();

      // ===== DOM REFS =====
      const canvas = document.getElementById('creatorCanvas');
      const ctx = canvas.getContext('2d');
      const scrollArea = document.getElementById('scrollArea');
      const uploadBtnText = document.getElementById('uploadBtnText');
      const mediaUpload = document.getElementById('mediaUpload');
      const zoomRange = document.getElementById('zoomRange');
      const userNameInput = document.getElementById('userName');
      const shuffleBtn = document.getElementById('shuffleBtn');
      const actionDownloadBtn = document.getElementById('actionDownloadBtn');
      const actionShareBtn = document.getElementById('actionShareBtn');
      const videoStatus = document.getElementById('videoStatus');
      const modeImageBtn = document.getElementById('modeImageBtn');
      const modeVideoBtn = document.getElementById('modeVideoBtn');

      // ===== STATE =====
      let userImage = null;
      let userVideo = null;
      let photoScale = 1;
      let photoOffsetX = 0;
      let photoOffsetY = 0;
      let currentMode = 'image';
      let animationId = null;
      let recordingStartTime = 0;
      let lastRecordedVideoBlob = null;
      let isDragging = false;
      let startX = 0, startY = 0;
      let currentRotatingSlogan = "ACT EARLY, PROTECT YOUR LIFE";
      let currentMascotIndex = 0;
      let mascotSide = 'right';
      let lastDrawTime = 0;

      // ===== MASCOT MOTION (video mode) =====
      // A timeline of keyframes: each entry { time, x, y, rot, scale }
      // The mascot will smoothly interpolate between them across the 10s clip.
      let mascotTimeline = null;

      // Predefined interesting positions (as fractions of canvas)
      // x, y = top-left position; rot = rotation (radians); scale = size multiplier
      function buildMascotTimeline() {
        // Base mascot size on canvas
        const baseH = 270;
        const baseW = 240; // will be recalculated per mascot but ~square

        const positions = [
          // Start: bottom-right (original position)
          { x: 1.00, y: 1.00, rot: 0, scale: 1.0 },
          // Slide to bottom-center
          { x: 0.50, y: 1.02, rot: -0.08, scale: 1.05 },
          // Bounce to top-right (smaller, peeking from corner)
          { x: 0.98, y: 0.05, rot: 0.15, scale: 0.75 },
          // Sweep to top-left
          { x: 0.02, y: 0.08, rot: -0.2, scale: 0.9 },
          // Drop to bottom-left
          { x: 0.02, y: 0.98, rot: 0.1, scale: 1.1 },
          // Wiggle to bottom-center
          { x: 0.50, y: 1.00, rot: -0.12, scale: 1.0 },
          // Rise to mid-right (near circle edge)
          { x: 0.98, y: 0.55, rot: 0.18, scale: 0.85 },
          // Final: settle at bottom-right (original-ish)
          { x: 1.00, y: 1.00, rot: 0, scale: 1.0 }
        ];

        // Assign times across 10s clip
        const times = [0, 1.2, 2.6, 4.0, 5.4, 6.8, 8.2, 9.8];

        mascotTimeline = positions.map((p, i) => ({
          time: times[i] * 1000, // ms
          x: p.x,
          y: p.y,
          rot: p.rot,
          scale: p.scale
        }));
      }

      // Get interpolated mascot state at time t (ms)
      function getMascotState(t) {
        if (!mascotTimeline || mascotTimeline.length === 0) {
          return { x: 1.0, y: 1.0, rot: 0, scale: 1.0 };
        }

        const tl = mascotTimeline;

        // Before first keyframe
        if (t <= tl[0].time) return { x: tl[0].x, y: tl[0].y, rot: tl[0].rot, scale: tl[0].scale };
        // After last keyframe
        if (t >= tl[tl.length - 1].time) {
          const last = tl[tl.length - 1];
          return { x: last.x, y: last.y, rot: last.rot, scale: last.scale };
        }

        // Find segment
        for (let i = 0; i < tl.length - 1; i++) {
          const a = tl[i];
          const b = tl[i + 1];
          if (t >= a.time && t <= b.time) {
            const segT = (t - a.time) / (b.time - a.time);
            // Smoothstep easing for extra polish
            const eased = segT * segT * (3 - 2 * segT);
            return {
              x: a.x + (b.x - a.x) * eased,
              y: a.y + (b.y - a.y) * eased,
              rot: a.rot + (b.rot - a.rot) * eased,
              scale: a.scale + (b.scale - a.scale) * eased
            };
          }
        }

        // Fallback
        return { x: 1.0, y: 1.0, rot: 0, scale: 1.0 };
      }

      // ===== ANIMATION STATE (video mode) =====
      let textAnimations = {
        title: null,
        curvedSlogan: null,
        rotatingSlogan: null,
        hashtags: null,
        name: null,
        credit: null
      };

      const animationPool = [
        'fadeIn', 'slideFromLeft', 'slideFromRight', 'slideFromTop',
        'slideFromBottom', 'scaleUp', 'scaleDown', 'wave', 'pulse',
        'glow', 'rotateIn', 'bounceIn', 'flipIn'
      ];

      function randomizeTextAnimations() {
        const pick = () => animationPool[Math.floor(Math.random() * animationPool.length)];
        textAnimations.title = pick();
        textAnimations.curvedSlogan = pick();
        textAnimations.rotatingSlogan = pick();
        textAnimations.hashtags = pick();
        textAnimations.name = pick();
        textAnimations.credit = pick();
      }

      function getAnimProgress(elapsed, delay, duration) {
        if (elapsed < delay) return 0;
        return Math.min(1, (elapsed - delay) / duration);
      }

      function getAnimState(animName, progress) {
        const state = { alpha: 1, offsetX: 0, offsetY: 0, scale: 1, rotate: 0, glow: 0 };
        const p = progress;

        switch (animName) {
          case 'fadeIn':
            state.alpha = p;
            break;
          case 'slideFromLeft':
            state.offsetX = -180 * (1 - p);
            state.alpha = p;
            break;
          case 'slideFromRight':
            state.offsetX = 180 * (1 - p);
            state.alpha = p;
            break;
          case 'slideFromTop':
            state.offsetY = -120 * (1 - p);
            state.alpha = p;
            break;
          case 'slideFromBottom':
            state.offsetY = 120 * (1 - p);
            state.alpha = p;
            break;
          case 'scaleUp':
            state.scale = 0.3 + 0.7 * p;
            state.alpha = p;
            break;
          case 'scaleDown':
            state.scale = 1.6 - 0.6 * p;
            state.alpha = p;
            break;
          case 'wave':
            state.offsetY = Math.sin(p * Math.PI * 4) * 18 * (1 - p);
            state.alpha = Math.min(1, p * 2);
            break;
          case 'pulse':
            state.scale = 1 + Math.sin(p * Math.PI * 6) * 0.12 * (1 - p);
            state.alpha = Math.min(1, p * 1.5);
            break;
          case 'glow':
            state.glow = Math.sin(p * Math.PI * 5) * 22;
            state.alpha = Math.min(1, p * 2);
            break;
          case 'rotateIn':
            state.rotate = -Math.PI * 0.6 * (1 - p);
            state.scale = 0.4 + 0.6 * p;
            state.alpha = p;
            break;
          case 'bounceIn':
            if (p < 0.7) {
              const tt = p / 0.7;
              state.scale = 0.3 + 1.0 * tt - 0.3 * Math.sin(tt * Math.PI);
            } else {
              state.scale = 1;
            }
            state.alpha = Math.min(1, p * 1.8);
            break;
          case 'flipIn':
            state.scale = 0.1 + 0.9 * p;
            state.rotate = Math.PI * (1 - p);
            state.alpha = p;
            break;
        }
        return state;
      }

      // ===== ASSETS =====
      const hospitalLogo = new Image();
      hospitalLogo.src = 'shah_logo.png';
      hospitalLogo.onload = () => { if (currentMode === 'image') scheduleDraw(); };
      hospitalLogo.onerror = () => {};

      const mascotSources = [
        'mascot_heart_1.png',
        'mascot_heart_2.png',
        'mascot_heart_3.png',
        'mascot_heart_4.png',
        'mascot_heart_5.png',
        'mascot_heart_6.png'
      ];
      let loadedMascots = [];
      let mascotsReady = false;
      let mascotLoadCount = 0;

      mascotSources.forEach((src, idx) => {
        const img = new Image();
        img.src = src;
        img.onload = () => {
          loadedMascots[idx] = img;
          mascotLoadCount++;
          if (mascotLoadCount === mascotSources.length) mascotsReady = true;
          if (idx === 0 && currentMode === 'image') scheduleDraw();
        };
        img.onerror = () => {
          mascotLoadCount++;
          if (mascotLoadCount === mascotSources.length) mascotsReady = true;
        };
      });

      const fallbackMascot = (() => {
        const c = document.createElement('canvas');
        c.width = 200; c.height = 200;
        const cx = c.getContext('2d');
        cx.fillStyle = '#ffb3b3';
        cx.beginPath();
        cx.arc(100, 100, 80, 0, 2 * Math.PI);
        cx.fill();
        cx.fillStyle = '#c81e1e';
        cx.font = 'bold 80px sans-serif';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText('❤️', 100, 100);
        return c;
      })();

      const bannerSloganText = "DON'T MISS A BEAT";
      const rotatingHeartbeatSlogans = [
        "ACT EARLY, PROTECT YOUR LIFE",
        "KNOW YOUR RISK FACTORS TODAY",
        "KEEP YOUR HEART HEALTHY & STRONG",
        "HEART DISEASE CAN HIDE IN PLAIN SIGHT",
        "USE HEART TO CONNECT & CARE"
      ];

      // ===== DRAW SCHEDULER =====
      let drawScheduled = false;
      function scheduleDraw() {
        if (drawScheduled) return;
        drawScheduled = true;
        requestAnimationFrame(() => {
          drawScheduled = false;
          drawCanvas(0);
        });
      }

      // ===== RANDOM MASCOT =====
      function randomizeMascot() {
        const available = loadedMascots
          .map((img, i) => (img && img.complete && img.naturalHeight !== 0) ? i : -1)
          .filter(i => i !== -1);

        if (available.length > 0) {
          currentMascotIndex = available[Math.floor(Math.random() * available.length)];
        } else {
          currentMascotIndex = Math.floor(Math.random() * mascotSources.length);
        }
        mascotSide = Math.random() > 0.5 ? 'right' : 'left';
      }

      // ===== CURVED TEXT =====
      function drawCurvedText(text, cx, cy, radius, options, animState) {
        const {
          fontSize = 54,
          fontWeight = '900',
          fontFamily = '-apple-system, sans-serif',
          fillStyle = '#ffe3e3',
          shadowColor = 'rgba(0,0,0,0.9)',
          shadowBlur = 16,
          letterSpacing = 4
        } = options || {};

        const state = animState || { alpha: 1, offsetX: 0, offsetY: 0, scale: 1, rotate: 0, glow: 0 };

        ctx.save();
        ctx.globalAlpha = state.alpha;
        ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = fillStyle;
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = shadowBlur + (state.glow || 0);

        const chars = text.split('');
        const charWidths = chars.map(ch => {
          const w = ctx.measureText(ch).width;
          return w + (letterSpacing || 0);
        });
        const totalWidth = charWidths.reduce((a, b) => a + b, 0);

        const circumference = 2 * Math.PI * radius;
        const stringAngleSpan = (totalWidth / circumference) * (2 * Math.PI);
        const stringCenterAngle = -Math.PI / 2;
        const stringStartAngle = stringCenterAngle - stringAngleSpan / 2;

        let currentAngle = stringStartAngle;
        for (let i = 0; i < chars.length; i++) {
          const ch = chars[i];
          const chWidth = charWidths[i];
          const chAngleSpan = (chWidth / circumference) * (2 * Math.PI);
          const charAngle = currentAngle + chAngleSpan / 2;

          const x = cx + radius * Math.cos(charAngle) + (state.offsetX || 0);
          const y = cy + radius * Math.sin(charAngle) + (state.offsetY || 0);

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(charAngle + Math.PI / 2 + (state.rotate || 0));
          if (state.scale !== 1) ctx.scale(state.scale, state.scale);
          ctx.fillText(ch, 0, 0);
          ctx.restore();

          currentAngle += chAngleSpan;
        }

        ctx.restore();
      }

      function withAnimation(animName, elapsed, delay, duration, drawFn) {
        if (currentMode !== 'video' || !animName) {
          drawFn({ alpha: 1, offsetX: 0, offsetY: 0, scale: 1, rotate: 0, glow: 0 });
          return;
        }
        const progress = getAnimProgress(elapsed, delay, duration);
        const state = getAnimState(animName, progress);
        drawFn(state);
      }

      // ===== DRAW MASCOT WITH MOTION =====
      function drawMascot(elapsedTime) {
        const activeMascot = loadedMascots[currentMascotIndex] || fallbackMascot;
        if (!activeMascot || activeMascot.complete === false) return;

        const isVideo = (currentMode === 'video');

        // Base dimensions
        const baseHeight = 270;
        const aspect = (activeMascot.width && activeMascot.height)
          ? (activeMascot.width / activeMascot.height)
          : 1;
        const baseWidth = baseHeight * aspect;

        let finalX, finalY, finalRot, finalScale, alpha;

        if (isVideo && mascotTimeline) {
          // Animated movement across the clip
          const state = getMascotState(elapsedTime);

          // Map normalized (0..1) coords to canvas positions
          // state.x: 0 = left edge, 1 = right edge (anchor = mascot top-left will be placed so that
          //          state.x = 1 means mascot's right edge touches canvas right edge)
          // We'll interpret state.x and state.y as "positioning factor" for the mascot's center.
          // state.x = 0 → mascot center at left edge; state.x = 1 → mascot center at right edge.
          const cx = state.x * canvas.width;
          const cy = state.y * canvas.height;

          finalScale = state.scale;
          finalRot = state.rot;
          const drawW = baseWidth * finalScale;
          const drawH = baseHeight * finalScale;

          finalX = cx - drawW / 2;
          finalY = cy - drawH / 2;

          // Fade in quickly at start
          const fadeIn = getAnimProgress(elapsedTime, 0, 600);
          alpha = fadeIn;

        } else {
          // Photo mode — static position (original logic)
          const mHeight = baseHeight;
          const mWidth = baseWidth;
          finalX = mascotSide === 'right' ? (canvas.width - mWidth - 25) : 25;
          finalY = 970 - mHeight;
          finalRot = 0;
          finalScale = 1;
          alpha = 1;
        }

        const drawW = baseWidth * finalScale;
        const drawH = baseHeight * finalScale;

        ctx.save();
        ctx.globalAlpha = alpha;

        // Backlight glow follows mascot
        const glowCx = finalX + drawW / 2;
        const glowCy = finalY + drawH / 2;
        const backLight = ctx.createRadialGradient(
          glowCx, glowCy, 20,
          glowCx, glowCy, 140
        );
        backLight.addColorStop(0, 'rgba(255,255,255,0.85)');
        backLight.addColorStop(0.4, 'rgba(255,120,140,0.55)');
        backLight.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = backLight;
        ctx.beginPath();
        ctx.arc(glowCx, glowCy, 135, 0, Math.PI * 2);
        ctx.fill();

        // Draw mascot with rotation around its center
        ctx.translate(finalX + drawW / 2, finalY + drawH / 2);
        ctx.rotate(finalRot);
        ctx.drawImage(activeMascot, -drawW / 2, -drawH / 2, drawW, drawH);

        ctx.restore();
      }

      // ===== MAIN DRAW =====
      function drawCanvas(elapsedTime) {
        const w = canvas.width;
        const h = canvas.height;
        const now = performance.now();
        if (now - lastDrawTime < 16 && elapsedTime === 0) return;
        lastDrawTime = now;

        const isVideo = (currentMode === 'video');
        const t = elapsedTime || 0;

        ctx.clearRect(0, 0, w, h);

        // 1. Background
        const bgGrad = ctx.createRadialGradient(500, 500, 100, 500, 500, 800);
        bgGrad.addColorStop(0, '#f93154');
        bgGrad.addColorStop(0.6, '#d90429');
        bgGrad.addColorStop(1, '#7a0010');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        // 2. Circle frame
        const circleRadius = 350;
        const circleX = 500;
        const circleY = 535;

        ctx.save();
        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.clip();

        if (userVideo && userVideo.readyState >= 2) {
          const vw = userVideo.videoWidth;
          const vh = userVideo.videoHeight;
          if (vw && vh) {
            const vSize = Math.min(vw, vh) * photoScale;
            const vx = (vw - vSize) / 2 + photoOffsetX;
            const vy = (vh - vSize) / 2 + photoOffsetY;
            ctx.drawImage(
              userVideo,
              vx, vy, vSize, vSize,
              circleX - circleRadius, circleY - circleRadius,
              circleRadius * 2, circleRadius * 2
            );
          }
        } else if (userImage) {
          const baseSize = (circleRadius * 2) * photoScale;
          const x = circleX - (baseSize / 2) + photoOffsetX;
          const y = circleY - (baseSize / 2) + photoOffsetY;
          ctx.drawImage(userImage, x, y, baseSize, baseSize);
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.fillStyle = '#d90429';
          ctx.font = 'bold 36px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Tap below to', circleX, circleY - 18);
          ctx.fillText('upload media', circleX, circleY + 28);
        }
        ctx.restore();

        // 3. Overlay
        ctx.save();
        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.clip();
        const overlayGrad = ctx.createLinearGradient(0, circleY - circleRadius, 0, circleY + circleRadius);
        overlayGrad.addColorStop(0, 'rgba(122,0,16,0.45)');
        overlayGrad.addColorStop(0.5, 'rgba(217,4,41,0.25)');
        overlayGrad.addColorStop(1, 'rgba(122,0,16,0.55)');
        ctx.fillStyle = overlayGrad;
        ctx.fill();
        ctx.restore();

        // 4. Border
        ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.arc(circleX, circleY, circleRadius, 0, Math.PI * 2);
        ctx.stroke();

        // 5. ECG
        drawContinuousNormalEcg(elapsedTime);

        // 6. Mascot (with motion in video mode)
        drawMascot(t);

        // ===== 7. HEADER — TITLE =====
        const headerY = 22;
        let logoWidthRightEdge = 175;

        if (hospitalLogo.complete && hospitalLogo.naturalHeight !== 0) {
          const targetLogoHeight = 75;
          const logoWidth = (hospitalLogo.width / hospitalLogo.height) * targetLogoHeight;
          const pillPaddingX = 14;
          const pillPaddingY = 8;
          const pillWidth = logoWidth + pillPaddingX * 2;
          const pillHeight = targetLogoHeight + pillPaddingY * 2;
          const pillX = 35;
          const pillY = headerY;

          if (isVideo) {
            const lp = getAnimProgress(t, 0, 500);
            ctx.globalAlpha = lp;
          }

          ctx.save();
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.shadowColor = 'rgba(0,0,0,0.25)';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.roundRect(pillX, pillY, pillWidth, pillHeight, 16);
          ctx.fill();
          ctx.restore();

          ctx.drawImage(hospitalLogo, pillX + pillPaddingX, pillY + pillPaddingY, logoWidth, targetLogoHeight);
          logoWidthRightEdge = pillX + pillWidth + 18;
          ctx.globalAlpha = 1;
        }

        const textStartX = logoWidthRightEdge;

        // Title — animated
        withAnimation(textAnimations.title, t, 100, 900, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const sc = state.scale;
          const rot = state.rotate;
          const glow = state.glow;

          if (sc !== 1 || rot !== 0) {
            ctx.translate(textStartX, headerY + 52);
            ctx.rotate(rot);
            ctx.scale(sc, sc);
            ctx.translate(-textStartX, -(headerY + 52));
          }

          ctx.textAlign = 'left';
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 48px -apple-system, sans-serif';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 14 + glow;
          ctx.fillText('WORLD HEART DAY 2026', textStartX + ox, headerY + 48 + oy);
          ctx.restore();
        });

        // ===== 8. CURVED SLOGAN =====
        const sloganRadius = circleRadius + 48;
        withAnimation(textAnimations.curvedSlogan, t, 500, 1000, (state) => {
          drawCurvedText(bannerSloganText, circleX, circleY, sloganRadius, {
            fontSize: 54,
            fontWeight: '900',
            fontFamily: '-apple-system, sans-serif',
            fillStyle: '#ffe3e3',
            shadowColor: 'rgba(0,0,0,0.9)',
            shadowBlur: 16,
            letterSpacing: 4
          }, state);
        });

        // ===== 9. NAME =====
        const nameText = userNameInput.value.trim() ? userNameInput.value.toUpperCase() : "";
        if (nameText) {
          withAnimation(textAnimations.name, t, 1000, 800, (state) => {
            ctx.save();
            ctx.globalAlpha = state.alpha;
            const ox = state.offsetX, oy = state.offsetY;
            const sc = state.scale;
            const rot = state.rotate;
            const glow = state.glow;

            if (sc !== 1 || rot !== 0) {
              ctx.translate(canvas.width / 2, 490);
              ctx.rotate(rot);
              ctx.scale(sc, sc);
              ctx.translate(-canvas.width / 2, -490);
            }

            ctx.textAlign = 'center';
            ctx.fillStyle = '#fff0f3';
            ctx.font = '900 32px -apple-system, sans-serif';
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 8 + glow;
            ctx.fillText(nameText, canvas.width / 2 + ox, 490 + oy, 650);
            ctx.restore();
          });
        }

        // ===== 10. ROTATING SLOGAN =====
        withAnimation(textAnimations.rotatingSlogan, t, 1500, 900, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const sc = state.scale;
          const rot = state.rotate;
          const glow = state.glow;

          if (sc !== 1 || rot !== 0) {
            ctx.translate(canvas.width / 2, 838);
            ctx.rotate(rot);
            ctx.scale(sc, sc);
            ctx.translate(-canvas.width / 2, -838);
          }

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 42px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.9)';
          ctx.shadowBlur = 14 + glow;

          if (textAnimations.rotatingSlogan === 'wave' || textAnimations.rotatingSlogan === 'pulse') {
            const fullText = currentRotatingSlogan;
            const totalW = ctx.measureText(fullText).width;
            let startX = canvas.width / 2 - totalW / 2 + ox;
            const y = 838 + oy;
            for (let i = 0; i < fullText.length; i++) {
              const ch = fullText[i];
              const chW = ctx.measureText(ch).width;
              const waveY = Math.sin((t / 200) + i * 0.5) * 8;
              ctx.fillText(ch, startX, y + waveY);
              startX += chW;
            }
          } else {
            wrapText(ctx, currentRotatingSlogan, canvas.width / 2 + ox, 838 + oy, 800, 48);
          }
          ctx.restore();
        });

        // ===== 11. HASHTAGS =====
        withAnimation(textAnimations.hashtags, t, 2000, 800, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const sc = state.scale;
          const rot = state.rotate;
          const glow = state.glow;

          if (sc !== 1 || rot !== 0) {
            ctx.translate(canvas.width / 2, 916);
            ctx.rotate(rot);
            ctx.scale(sc, sc);
            ctx.translate(-canvas.width / 2, -916);
          }

          ctx.fillStyle = '#ffe3e3';
          ctx.font = '900 32px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.8)';
          ctx.shadowBlur = 10 + glow;
          ctx.fillText('#DontMissABeat   #UseHeart', canvas.width / 2 + ox, 916 + oy);
          ctx.restore();
        });

        // ===== 12. CREDIT =====
        withAnimation(textAnimations.credit, t, 2400, 700, (state) => {
          ctx.save();
          ctx.globalAlpha = state.alpha;
          const ox = state.offsetX, oy = state.offsetY;
          const glow = state.glow;

          ctx.fillStyle = 'rgba(255,255,255,0.85)';
          ctx.font = '300 16px -apple-system, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0,0,0,0.5)';
          ctx.shadowBlur = 6 + glow;
          ctx.fillText('Developed by: Ahmed Shareef for Shaviyani Atoll Hospital', canvas.width / 2 + ox, 972 + oy);
          ctx.restore();
        });
      }

      // ===== ECG =====
      function drawContinuousNormalEcg(elapsedTime) {
        ctx.save();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(255,255,255,0.95)';
        ctx.shadowBlur = 14;
        ctx.beginPath();

        const ecgY = 665;
        const totalDuration = 10000;
        const progress = (currentMode === 'video') ? Math.min(1, elapsedTime / totalDuration) : 1.0;
        const maxVisibleX = canvas.width * progress;

        function getEcgOffset(t) {
          const cycleTime = 750;
          const localT = t % cycleTime;
          let val = 0;
          if (localT > 100 && localT < 220) {
            val -= 12 * Math.sin(((localT - 100) / 120) * Math.PI);
          } else if (localT >= 260 && localT < 290) {
            val += 18;
          } else if (localT >= 290 && localT < 340) {
            val -= 195 * Math.sin(((localT - 290) / 50) * Math.PI);
          } else if (localT >= 340 && localT < 380) {
            val += 45 * Math.sin(((localT - 340) / 40) * Math.PI);
          } else if (localT >= 460 && localT < 640) {
            val -= 28 * Math.sin(((localT - 460) / 180) * Math.PI);
          }
          return val;
        }

        let started = false;
        const timeShift = (currentMode === 'video') ? elapsedTime : (performance.now() * 0.4);
        const endX = (currentMode === 'video') ? maxVisibleX : canvas.width;

        for (let x = 0; x <= endX; x += 4) {
          const t = x * 2.2 + timeShift;
          const y = ecgY + getEcgOffset(t);
          if (!started) {
            ctx.moveTo(x, y);
            started = true;
          } else {
            ctx.lineTo(x, y);
          }
        }
        ctx.stroke();
        ctx.restore();
      }

      // ===== TEXT WRAP =====
      function wrapText(context, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let currentY = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          if (context.measureText(testLine).width > maxWidth && n > 0) {
            context.fillText(line, x, currentY);
            line = words[n] + ' ';
            currentY += lineHeight;
          } else {
            line = testLine;
          }
        }
        context.fillText(line, x, currentY);
      }

      // ===== FILE HANDLING =====
      function handleMediaSelect(e) {
        const file = e.target.files[0];
        if (!file) return;

        photoOffsetX = 0;
        photoOffsetY = 0;
        zoomRange.value = 1;
        photoScale = 1;

        if (file.type.startsWith('video/')) {
          if (userVideo) { userVideo.pause(); userVideo.src = ''; }
          userVideo = document.createElement('video');
          userVideo.src = URL.createObjectURL(file);
          userVideo.loop = true;
          userVideo.muted = false;
          userVideo.playsInline = true;
          userVideo.setAttribute('playsinline', '');
          userVideo.setAttribute('webkit-playsinline', '');
          userVideo.crossOrigin = 'anonymous';
          userVideo.volume = 1.0;
          userVideo.play().catch(() => {});
          userVideo.onloadeddata = () => scheduleDraw();
          userImage = null;
        } else {
          if (userVideo) { userVideo.pause(); userVideo.src = ''; userVideo = null; }
          const reader = new FileReader();
          reader.onload = (ev) => {
            userImage = new Image();
            userImage.src = ev.target.result;
            userImage.onload = () => scheduleDraw();
          };
          reader.readAsDataURL(file);
        }
        setTimeout(() => { mediaUpload.value = ''; }, 500);
      }

      mediaUpload.addEventListener('change', handleMediaSelect);

      // ===== TOUCH DRAG =====
      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - photoOffsetX;
          startY = e.touches[0].clientY - photoOffsetY;
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (isDragging && e.touches.length === 1) {
          photoOffsetX = e.touches[0].clientX - startX;
          photoOffsetY = e.touches[0].clientY - startY;
          if (currentMode === 'image') scheduleDraw();
          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        isDragging = false;
        e.preventDefault();
      }, { passive: false });

      canvas.addEventListener('touchcancel', () => { isDragging = false; });

      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - photoOffsetX;
        startY = e.clientY - photoOffsetY;
        e.preventDefault();
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        photoOffsetX = e.clientX - startX;
        photoOffsetY = e.clientY - startY;
        if (currentMode === 'image') scheduleDraw();
      });
      window.addEventListener('mouseup', () => { isDragging = false; });

      // ===== UI LISTENERS =====
      zoomRange.addEventListener('input', (e) => {
        photoScale = parseFloat(e.target.value);
        if (currentMode === 'image') scheduleDraw();
      });

      userNameInput.addEventListener('input', () => {
        if (currentMode === 'image') scheduleDraw();
      });

      shuffleBtn.addEventListener('click', () => {
        const currentIndex = rotatingHeartbeatSlogans.indexOf(currentRotatingSlogan);
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * rotatingHeartbeatSlogans.length);
        } while (nextIndex === currentIndex && rotatingHeartbeatSlogans.length > 1);
        currentRotatingSlogan = rotatingHeartbeatSlogans[nextIndex];
        randomizeMascot();
        if (currentMode === 'image') scheduleDraw();
      });

      // ===== MODE SWITCH =====
      window.switchMode = function(mode) {
        currentMode = mode;
        if (animationId) cancelAnimationFrame(animationId);
        lastRecordedVideoBlob = null;

        modeImageBtn.classList.toggle('active', mode === 'image');
        modeVideoBtn.classList.toggle('active', mode === 'video');

        if (mode === 'image') {
          videoStatus.classList.remove('visible');
          actionDownloadBtn.textContent = '💾 Save Image';
          actionShareBtn.textContent = '📤 Share Card';
          uploadBtnText.textContent = '📸 Shoot / Select Photo';
          mediaUpload.accept = 'image/*';
          mediaUpload.setAttribute('capture', 'environment');
          if (userVideo) { userVideo.pause(); userVideo = null; }
          mascotTimeline = null;
          scheduleDraw();
        } else {
          randomizeTextAnimations();
          buildMascotTimeline();
          videoStatus.classList.add('visible');
          videoStatus.textContent = '🎥 10s Video · Animated text & moving mascot';
          actionDownloadBtn.textContent = '📥 Export MP4';
          actionShareBtn.textContent = '📤 Share MP4';
          uploadBtnText.textContent = '🎬 Record / Select Video';
          mediaUpload.accept = 'video/*';
          mediaUpload.removeAttribute('capture');
          userImage = null;
          recordingStartTime = performance.now();
          startVideoPreviewLoop();
        }
        mediaUpload.value = '';
      };

      // ===== VIDEO PREVIEW =====
      function startVideoPreviewLoop() {
        function loop(timestamp) {
          if (currentMode !== 'video') return;
          const elapsed = timestamp - recordingStartTime;
          drawCanvas(elapsed);
          if (elapsed < 10000) {
            animationId = requestAnimationFrame(loop);
          } else {
            videoStatus.textContent = '✅ 10s preview finished — tap Export MP4';
          }
        }
        animationId = requestAnimationFrame(loop);
      }

      // ===== DOWNLOAD =====
      actionDownloadBtn.addEventListener('click', async () => {
        if (currentMode === 'image') {
          const link = document.createElement('a');
          link.download = 'world-heart-day-2026.png';
          link.href = canvas.toDataURL('image/png');
          link.click();
        } else {
          if (!window.MediaRecorder) {
            alert('Video recording is not supported on this browser.');
            return;
          }
          if (lastRecordedVideoBlob) {
            downloadVideoBlob(lastRecordedVideoBlob);
            return;
          }

          // Fresh animations and mascot path for the export
          randomizeTextAnimations();
          buildMascotTimeline();

          videoStatus.classList.add('visible');
          videoStatus.textContent = '🎥 Recording 10s video with moving mascot... Please wait.';

          recordingStartTime = performance.now();
          const canvasStream = canvas.captureStream(30);

          try {
            let combinedStream;
            let audioCtx = null;

            if (userVideo && userVideo.srcObject instanceof MediaStream) {
              combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...userVideo.srcObject.getAudioTracks()
              ]);
            } else if (userVideo) {
              audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const source = audioCtx.createMediaElementSource(userVideo);
              const dest = audioCtx.createMediaStreamDestination();
              source.connect(dest);
              source.connect(audioCtx.destination);
              combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...dest.stream.getAudioTracks()
              ]);
            } else {
              combinedStream = new MediaStream([...canvasStream.getVideoTracks()]);
            }

            let mime = 'video/mp4;codecs=avc1.42E01E,mp4a.40.2';
            if (!MediaRecorder.isTypeSupported(mime)) {
              mime = 'video/mp4';
              if (!MediaRecorder.isTypeSupported(mime)) {
                mime = 'video/webm;codecs=h264,opus';
              }
            }

            const recorder = new MediaRecorder(combinedStream, { mimeType: mime });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            recorder.onstop = () => {
              if (audioCtx) audioCtx.close().catch(() => {});
              lastRecordedVideoBlob = new Blob(chunks, { type: 'video/mp4' });
              downloadVideoBlob(lastRecordedVideoBlob);
              videoStatus.textContent = '✅ 10s video saved with moving mascot!';
            };

            recorder.start();
            startVideoPreviewLoop();

            setTimeout(() => {
              if (recorder.state !== 'inactive') recorder.stop();
            }, 10000);

          } catch (err) {
            console.error(err);
            alert('Video export error: ' + err.message + '\n\nNote: Audio capture works best when a video with sound is uploaded.');
            videoStatus.classList.remove('visible');
          }
        }
      });

      function downloadVideoBlob(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'world-heart-day-2026-clip.mp4';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }

      // ===== SHARE =====
      actionShareBtn.addEventListener('click', async () => {
        if (currentMode === 'image') {
          const dataUrl = canvas.toDataURL('image/png');
          const blob = await (await fetch(dataUrl)).blob();
          const file = new File([blob], 'world-heart-day-2026.png', { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'World Heart Day 2026',
                text: `${bannerSloganText} — ${currentRotatingSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                files: [file]
              });
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('Share failed', err);
            }
          } else {
            alert('Direct sharing is not supported here. Please use "Save Image" instead.');
          }
        } else {
          if (!lastRecordedVideoBlob) {
            alert('Please click "Export MP4" first to record the 10s clip before sharing.');
            return;
          }
          const videoFile = new File([lastRecordedVideoBlob], 'world-heart-day-2026-clip.mp4', { type: 'video/mp4' });

          if (navigator.canShare && navigator.canShare({ files: [videoFile] })) {
            try {
              await navigator.share({
                title: 'World Heart Day 2026 Video Clip',
                text: `${bannerSloganText} — ${currentRotatingSlogan} #WorldHeartDay #DontMissABeat #UseHeart`,
                files: [videoFile]
              });
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('Share failed', err);
            }
          } else {
            alert('Direct video sharing is not supported. Your MP4 was saved to downloads.');
          }
        }
      });

      // ===== PREVENT SCROLL BOUNCE ON CANVAS =====
      document.getElementById('canvasFrame').addEventListener('touchmove', (e) => {
        if (e.target === canvas) e.preventDefault();
      }, { passive: false });

      // ===== PREVENT DOUBLE-TAP ZOOM =====
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

      // ===== INIT =====
      randomizeMascot();
      randomizeTextAnimations();
      scheduleDraw();

      window.addEventListener('load', () => {
        if (currentMode === 'image') scheduleDraw();
      });

      // ===== VISIBILITY CHANGE =====
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (userVideo) userVideo.pause();
          if (animationId) cancelAnimationFrame(animationId);
        } else {
          if (userVideo && currentMode === 'image') userVideo.play().catch(() => {});
          if (currentMode === 'image') scheduleDraw();
        }
      });

    })();
  </script>
</body>
</html>
