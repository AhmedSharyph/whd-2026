<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>World Heart Day 2026 - Creator</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WHD Creator">

    <style>
        :root {
            --primary-red: #c1121f;
            --dark-red: #780000;
            --accent-pink: #fdf0ed;
            --bg-color: #f7f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #212529;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .creator-container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(193, 18, 31, 0.12);
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            margin: 0 0 4px 0;
            color: var(--primary-red);
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            font-size: 0.8rem;
            color: #6c757d;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f1f3f5;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.06);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
        }

        label.field-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #495057;
            margin-left: 2px;
        }

        .file-upload-btn {
            background: var(--accent-pink);
            border: 2px dashed var(--primary-red);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            color: var(--primary-red);
            text-align: center;
            transition: background 0.2s;
        }

        .file-upload-btn:active {
            background: #f8d7da;
        }

        input[type="file"] {
            display: none;
        }

        input[type="text"], input[type="range"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            box-sizing: border-box;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--primary-red);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .btn {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-shuffle {
            background: #495057;
            color: white;
            grid-column: span 2;
        }

        .btn-download {
            background: #212529;
            color: white;
        }

        .btn-share {
            background: var(--primary-red);
            color: white;
        }
    </style>
</head>
<body>

    <div class="creator-container">
        <h2>WORLD HEART DAY</h2>
        <p class="subtitle">#DontMissABeat #UseHeart</p>
        
        <!-- Live Preview Canvas -->
        <div class="canvas-wrapper">
            <canvas id="creatorCanvas" width="1000" height="1000"></canvas>
        </div>

        <!-- Controls -->
        <div class="controls">
            <label class="file-upload-btn">
                📷 Tap to Choose or Take Photo
                <input type="file" id="imageUpload" accept="image/*">
            </label>

            <label class="field-label" for="zoomRange">Adjust Photo Zoom</label>
            <input type="range" id="zoomRange" min="0.5" max="2.5" step="0.05" value="1">

            <label class="field-label" for="userName">Your Name or Team (Optional)</label>
            <input type="text" id="userName" placeholder="e.g. Community Health Team" maxlength="28">

            <button class="btn btn-shuffle" id="shuffleBtn">🔄 Shuffle Campaign Slogan</button>
            
            <div class="btn-group">
                <button class="btn btn-download" id="downloadBtn">💾 Save Image</button>
                <button class="btn btn-share" id="shareBtn">📤 Share Card</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('creatorCanvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const zoomRange = document.getElementById('zoomRange');
        const userNameInput = document.getElementById('userName');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');

        let userImage = null;
        let photoScale = 1;

        // Official 2026 Rotating Campaign Slogans
        const campaignThemes = [
            "Don't Miss a Beat: See the Hidden Signs",
            "Protect Your Heart: Act Early & Live Well",
            "Keep the Beat: Move More, Eat Healthier",
            "Use Heart for Action: Know Your Risks",
            "Heart Health First: Don't Skip Your Checkup"
        ];
        let currentSlogan = campaignThemes[0];

        // Load Default State
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    userImage = new Image();
                    userImage.src = event.target.result;
                    userImage.onload = () => drawCanvas();
                };
                reader.readAsDataURL(file);
            }
        });

        zoomRange.addEventListener('input', (e) => {
            photoScale = parseFloat(e.target.value);
            drawCanvas();
        });

        userNameInput.addEventListener('input', () => drawCanvas());

        shuffleBtn.addEventListener('click', () => {
            const currentIndex = campaignThemes.indexOf(currentSlogan);
            let nextIndex;
            do {
                nextIndex = Math.floor(Math.random() * campaignThemes.length);
            } while (nextIndex === currentIndex);
            currentSlogan = campaignThemes[nextIndex];
            drawCanvas();
        });

        // Helper: Draw Heart Path Geometry
        function getHeartPath() {
            const path = new Path2D();
            path.moveTo(500, 310);
            path.bezierCurveTo(410, 190, 250, 210, 250, 370);
            path.bezierCurveTo(250, 530, 500, 710, 500, 710);
            path.bezierCurveTo(500, 710, 750, 530, 750, 370);
            path.bezierCurveTo(750, 210, 590, 190, 500, 310);
            path.closePath();
            return path;
        }

        // Core Canvas Renderer
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Background Fill (Clean White)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Render User Photo inside Heart Mask
            ctx.save();
            const heartPath = getHeartPath();
            ctx.clip(heartPath);

            if (userImage) {
                const baseSize = Math.max(canvas.width, canvas.height) * photoScale;
                const x = (canvas.width - baseSize) / 2;
                const y = (canvas.height - baseSize) / 2 + 30; // slight offset for heart centering
                ctx.drawImage(userImage, x, y, baseSize, baseSize);
            } else {
                // Placeholder gradient inside heart
                const grad = ctx.createLinearGradient(0, 200, 0, 700);
                grad.addColorStop(0, '#f8d7da');
                grad.addColorStop(1, '#f1f3f5');
                ctx.fillStyle = grad;
                ctx.fill(heartPath);

                ctx.fillStyle = '#c1121f';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Tap above to', 500, 430);
                ctx.fillText('upload photo', 500, 475);
            }
            ctx.restore();

            // 3. Campaign Red Frame Border & Accents
            ctx.strokeStyle = '#c1121f';
            ctx.lineWidth = 14;
            ctx.stroke(heartPath);

            // Outer decorative corners / Header band
            ctx.fillStyle = '#c1121f';
            ctx.fillRect(0, 0, canvas.width, 100);

            // Top Header Text
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 44px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('WORLD HEART DAY 2026', canvas.width / 2, 62);

            // Bottom Banner Band
            ctx.fillStyle = '#780000';
            ctx.fillRect(0, canvas.height - 150, canvas.width, 150);

            // Rotating Slogan
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 30px sans-serif';
            wrapText(ctx, currentSlogan, canvas.width / 2, canvas.height - 100, canvas.width - 80, 38);

            // Custom Name / Hashtags
            const nameText = userNameInput.value.trim() ? userNameInput.value.toUpperCase() : "#DontMissABeat #UseHeart";
            ctx.fillStyle = '#ffccd5';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText(nameText, canvas.width / 2, canvas.height - 32);
        }

        // Text Wrapping Utility
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            let currentY = y;

            for (let n = 0; n < words.length; n++) {
                const testLine = line + words[n] + ' ';
                if (context.measureText(testLine).width > maxWidth && n > 0) {
                    context.fillText(line, x, currentY);
                    line = words[n] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, currentY);
        }

        // Initial canvas paint on load
        drawCanvas();

        // Download Action
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'world-heart-day-2026.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Web Share API (Android & iOS Native Share)
        shareBtn.addEventListener('click', async () => {
            try {
                const dataUrl = canvas.toDataURL('image/png');
                const blob = await (await fetch(dataUrl)).blob();
                const file = new File([blob], 'world-heart-day-2026.png', { type: 'image/png' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'World Heart Day 2026',
                        text: `${currentSlogan} #WorldHeartDay #DontMissABeat`,
                        files: [file]
                    });
                } else {
                    alert("Direct sharing is restricted in this browser view. Please use 'Save Image' instead!");
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error("Sharing failed:", err);
                }
            }
        });
    </script>
</body>
</html>
